# The Course Studio API, as a machine can read it.
#
# Hand-written, one operation per registered route, and held to that by
# `test/openapi.test.js`: it walks the router's own `(method, path)` pairs and
# asserts the set equals the set of operations here, both ways. A route with no
# entry fails the suite; an entry with no route fails it too. That test is the
# `check:demos` of the API — a stale spec looks fine in review and sends an
# agent to a 404.
#
# Served at `GET /openapi.json`. The YAML is converted at build time
# (`npm run build:openapi`, `tools/openapi.js`) into `src/openapi.generated.js`,
# which is what the Lambda imports: nothing on a request path parses YAML.
# `info.version` is written from `package.json` by that build, so it cannot
# drift from the package it describes.
#
# The prose an agent needs *around* these routes — the edit loop, the block-id
# discipline, what a 422 means — is `docs/api/agent-guide.md`. This file is the
# shape of every request and answer; that one is how to use them.

openapi: 3.1.0

info:
  title: Course Studio API
  version: 0.0.0
  summary: Edit, preview and publish Hebrew lecture notes and decks.
  description: |
    One handler over a versioned object store. Everything a lecture is — the
    notes fragment, the deck fragment, the manifest, the figures, the author
    notes thread — is read and written here, by the studio SPA, by the
    `studio` CLI, and by an agent holding a token.

    Three things govern every call:

    - **The tenant is never in the path.** It is fixed in the deployment, so
      the IAM policy `tenants/<t>/*` means something.
    - **Every write needs the `authors` group.** A `viewers` session may read
      everything, including drafts, and is refused every non-GET by method.
      There are no per-route exceptions.
    - **A document save is conditional.** `PUT …/notes` and `PUT …/slides`
      require `If-Match` with the ETag from the `GET` (or `If-None-Match: *`
      to create), and answer `412` with the current ETag and who wrote it.

    Errors are always `{ error, message, ... }` — the code in `error` is
    stable, `message` is a sentence for a person, and some codes carry extra
    keys (`etag` and `actor` on a 412, `path` on a validation failure).
  license:
    name: Proprietary — Fieldwork
  x-guides:
    agent: docs/api/agent-guide.md
    vocabulary: docs/api/vocabulary.md
    lecture: docs/api/lecture.schema.json
    course: docs/api/course.schema.json

servers:
  - url: /api
    description: Same origin as the studio SPA and the published site.

security:
  - bearer: []

tags:
  - name: session
    description: Who is asking.
  - name: contract
    description: The API describing itself.
  - name: courses
    description: A course, its theme and its guides.
  - name: lectures
    description: The documents, their history and their assets.
  - name: publish
    description: Draft to student-visible page.
  - name: threads
    description: Author notes on a block.
  - name: dev
    description: The local stand-ins for presigned S3 URLs. Not deployed.
  - name: public
    description: What a visitor with no account may read.

paths:

  /openapi.json:
    get:
      tags: [contract]
      operationId: getOpenapi
      summary: This document, as JSON.
      description: |
        The spec the deployment is actually running, with `info.version` equal
        to the API package's version. Any `read` may fetch it.
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        '401': { $ref: '#/components/responses/unauthenticated' }

  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: The signed-in actor, their groups and the tenant.
      description: |
        The first call of any client. `groups` decides what the rest of the
        API will allow: `authors` writes, `viewers` reads.
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                type: object
                required: [actor, groups, tenant]
                properties:
                  actor: { type: string, description: 'the email claim' }
                  groups:
                    type: array
                    items: { type: string, enum: [authors, viewers] }
                  tenant: { type: string }
                  opened:
                    type: array
                    items: { type: string }
                    description: the courses the caller opened with `POST /courses` (empty for an administrator)
                  courseLimit:
                    type: [integer, 'null']
                    description: how many the caller may open in all; null for an administrator, who is not counted
                  dev: { type: boolean, description: 'true on the local dev server' }
                  connector:
                    type: string
                    description: |
                      The OAuth client id, when the caller came in through
                      `POST /mcp` as a connector. Absent for a session and for
                      an access token. Public by design; the secret beside it
                      is not, and appears in no response at all.
        '401': { $ref: '#/components/responses/unauthenticated' }

  /public/courses:
    get:
      tags: [public]
      operationId: listPublicCourses
      summary: The published courses, with a link per published lecture.
      description: |
        **No credential.** The only route on this API that needs none: it is
        what the studio's landing page draws for a signed-out visitor, and the
        gateway reaches it without the authorizer.

        Only **published** lectures appear, computed from `published` on each
        lecture manifest exactly as `GET /courses/{c}` computes it, and a
        course with no published lecture is not listed at all. Nothing from a
        draft is in the answer — no notes, no guides, no members, no grants,
        no publish version. `GET /courses` is the other list and is not this
        one: it is filtered by the caller's grants and carries draft state.

        `site` is the origin the published notes are served from, and each
        lecture's `url` is `site + /<course>/<lecture>/notes` — the page
        `POST …/publish` wrote. `cache-control: public, max-age=300`.
      security: []
      responses:
        '200':
          description: The published courses.
          content:
            application/json:
              schema:
                type: object
                required: [site, courses]
                properties:
                  site:
                    type: string
                    description: 'the origin the published notes are on, no trailing slash'
                  courses:
                    type: array
                    items:
                      type: object
                      required: [id, title, titleEn, term, lecturer, lang, lectures]
                      properties:
                        id: { type: string }
                        title: { type: [string, 'null'], description: 'the Hebrew name' }
                        titleEn: { type: [string, 'null'] }
                        term: { type: [string, 'null'] }
                        lecturer: { type: [string, 'null'] }
                        lang: { type: string, description: "the course language, `he` unless it says otherwise" }
                        lectures:
                          type: array
                          description: 'the published lectures, in lecture-number order'
                          items:
                            type: object
                            required: [id, number, title, url, publishedAt]
                            properties:
                              id: { type: string }
                              number: { type: [integer, 'null'] }
                              title: { type: [string, 'null'] }
                              url: { type: string, description: 'the notes page on the courses site' }
                              publishedAt: { type: [string, 'null'], format: date-time }

  /courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: Every course under the tenant.
      responses:
        '200':
          description: The courses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { type: string }
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        titleEn: { type: [string, 'null'] }
                        term: { type: [string, 'null'] }
                        lectures: { type: integer, description: 'how many, not which' }
                        lastModified: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/unauthenticated' }
    post:
      tags: [courses]
      operationId: createCourse
      summary: Open a new course, and become its author.
      description: |
        For a lecturer starting a course of their own. Any `authors` session
        may call it; the caller is granted `author` on the new course in the
        same request, so it is in their next `GET /courses`. A signed-in
        session only — a token or a connector gets `403 session_required`,
        because a held credential must not be able to widen its owner's reach.

        The body is `course.json` without `lectures` and **without `id`**:
        `title` is the only required field. The id is generated — eight
        characters of lower-case Crockford base32 — and comes back in the
        answer; a body that carries `id` or `address` is `400 invalid_course`,
        so a script written before 2026-09-17 fails loudly instead of quietly
        getting an id it did not ask for. The published address is set later,
        once, with `PUT /courses/{c}/address`. Events `course.create` and
        `access.grant`.

        **`lang`** is the course's language — `he` or `en` — chosen here and
        fixed afterwards; `dir` is derived from it and written by the route
        whatever the body said, and a body whose `dir` contradicts its `lang`
        is a `400 invalid_course` at `/dir`. The studio's form always sends
        `lang`. A body without one opens the course as `he` and the answer
        carries a `warnings` array saying so, so a script written before
        2026-09-17 goes on working; that default is for one more batch.

        **Capped**: a user may open `courseLimit` courses (ten unless an
        administrator raised it on their access record), counted by the
        record's `opened` list. Over it is `403 course_limit` with `opened`
        and `limit` in the body. Administrators are not counted.

        **`from`** opens the course on a copy of a course template instead of
        empty. There are two, `starter-he` and `starter-en` — the tour of the
        studio every new author is given, written once per language rather
        than translated: every lecture, guide, demo and figure under
        `templates/<from>/` is copied into the new course, and `course.json`
        is written from this request — the title yours, the lecturer line the
        caller, the language the template's. An unknown name is `400
        invalid_template` and nothing is written; a template the store does
        not hold is `502 template_unavailable`, likewise with nothing left
        behind. A `lang` that disagrees with the template's is `400
        invalid_course`: copying the Hebrew tour into a course declared
        English is two lectures of Hebrew prose on a left-to-right page. A
        course opened this way is an ordinary course: it counts against the
        ceiling, it has no reader password yet, and the author may delete every
        lecture in it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                titleEn: { type: [string, 'null'] }
                term: { type: [string, 'null'] }
                lecturer: { type: [string, 'null'] }
                lang: { type: string }
                dir: { type: string, enum: [rtl, ltr] }
                theme: { $ref: '#/components/schemas/Theme' }
                platform: { type: string }
                from:
                  type: string
                  enum: [starter-he, starter-en]
                  description: >-
                    open the course on a copy of this course template; it
                    decides the course's language unless `lang` says the same
      responses:
        '201':
          description: Created, and granted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { $ref: '#/components/schemas/Course' }
                  etag: { type: string }
                  versionId: { type: string }
                  role:
                    type: string
                    enum: [author, admin]
                    description: what the caller now is on the course
                  warnings:
                    type: array
                    items: { type: string }
                    description: >-
                      present only when something was assumed — today, a body
                      with no `lang`, opened as `he`
                  from:
                    type: string
                    description: the template the course was opened on, when it was
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '502':
          description: |
            `template_unavailable` — the named template is not in the store, or
            it holds something that belongs to a course and not to a template.
            Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: getCourse
      summary: The course, its lectures with their state, and the guides present.
      description: |
        One request for the whole course page: `course.json`, a summary row
        per lecture (when it was last touched and by whom, whether it is
        published, how many author notes are open, whether it has a deck), and
        the names of the guides in the store.
      responses:
        '200':
          description: The course.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { $ref: '#/components/schemas/Course' }
                  etag: { type: string }
                  lectures:
                    type: array
                    items: { $ref: '#/components/schemas/LectureSummary' }
                  reader:
                    type: object
                    description: |
                      Whether this course has a reader password, and nothing
                      more — the password itself is `GET …/reader-password`,
                      which a `viewer` is refused.
                    properties:
                      set: { type: [string, 'null'], format: date-time }
                  guides:
                    type: array
                    items: { $ref: '#/components/schemas/GuideEntry' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [courses]
      operationId: putCourse
      summary: Write `course.json`.
      description: |
        Validated against `course.schema.json`; an unknown key is a `400`
        naming its JSON Pointer. `id` is overwritten with the one in the path.
        Event `course.save`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Course' }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { $ref: '#/components/schemas/Course' }
                  etag: { type: string }
                  versionId: { type: string }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
    delete:
      tags: [courses]
      operationId: deleteCourse
      summary: Delete the course, whole. Administrators only, with the title repeated.
      description: |
        Removes every object under the course — lectures, figures, demos,
        notes, theme — the course's address claim, and the course's place in
        every access record, which frees the opener's slot under the cap. The
        versioned bucket is the only undo. The published copy on the site is
        not touched, so the address is free but the pages at it stay until
        something is published over them. Event `course.delete`.
      parameters:
        - name: confirm
          in: query
          required: true
          description: >-
            The course **title** again (it was the id until 2026-09-17, when
            the id stopped being something a person chose). Anything else is
            `400 confirm_required`.
          schema: { type: string }
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/guides:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: listGuides
      summary: The course's working documents that exist, and the four names there can be.
      description: |
        `conventions`, `glossary`, `syllabus`, `style`. Read these before
        writing a line of the course: they carry the notation, the sign
        conventions, the one Hebrew term per concept and the house style.
      responses:
        '200':
          description: The guides.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { type: string }
                  names:
                    type: array
                    items: { type: string, enum: [conventions, glossary, syllabus, style] }
                  guides:
                    type: array
                    items: { $ref: '#/components/schemas/GuideEntry' }

  /courses/{c}/guides/{name}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/guideName'
    get:
      tags: [courses]
      operationId: getGuide
      summary: One guide, as markdown.
      responses:
        '200':
          description: The document.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            text/markdown:
              schema: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [courses]
      operationId: putGuide
      summary: Write one guide.
      description: |
        `If-Match` is optional — a first push has no ETag to send — and means
        what it means everywhere else when it is present. At most 256 KB.
        Event `guide.save`.
      parameters:
        - $ref: '#/components/parameters/ifMatchOptional'
      requestBody:
        required: true
        content:
          text/markdown:
            schema: { type: string }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  etag: { type: string }
                  versionId: { type: string }
                  bytes: { type: integer }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '412': { $ref: '#/components/responses/precondition' }
        '413': { $ref: '#/components/responses/tooLarge' }

  /courses/{c}/theme:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: getTheme
      summary: The course's theme, and everything the theme panel draws.
      description: |
        The stored theme, its resolved tokens, the generated CSS, the four
        gallery presets, the twelve token roles, the vendored faces and the
        colour-vision verdict — one screen, one request.
      responses:
        '200':
          description: The theme.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeResponse' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [courses]
      operationId: putTheme
      summary: Save the theme and regenerate `theme.css`.
      description: |
        Strict: an unknown preset, a token that is not one of the twelve, a
        colour that is not `#RRGGBB`, a face that is not vendored or a weight
        that face does not ship is a `400` (`invalid_preset`, `invalid_token`,
        `invalid_colour`, `invalid_font`, `invalid_weight`). A failing
        colour-vision verdict is **not** a refusal: it comes back in the body.
        Event `theme.save`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Theme' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeResponse' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/theme.css:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: getCourseThemeCss
      summary: The generated `theme.css` for the course.
      description: |
        What the shell's relative `<link>` resolves to for a page at course
        level. A course still on the base theme has no stored CSS and answers
        `404` rather than an empty stylesheet.
      responses:
        '200': { $ref: '#/components/responses/css' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/address:
    parameters:
      - $ref: '#/components/parameters/course'
    put:
      tags: [courses]
      operationId: putCourseAddress
      summary: Set the course's published address, once, before the first publish.
      description: |
        The address is the first segment of every published URL, the key the
        edge looks a course up by, and the reader user name. It was the course
        id until 2026-09-17; the id is generated now and means nothing to a
        student, so the address is a field of its own, chosen in the publishing
        panel at the moment it matters — before the first publish.

        **Unique across the tenant**, and refused with `409 address_taken`
        otherwise (the race included: the claim object is written with
        `If-None-Match: *`). The platform's own names are refused with `400
        reserved_address`: `api`, `lib`, `studio`, `demos`, `index.html`,
        `robots.txt`, `templates`, `site`. Anything that is not a path segment
        is `400 invalid_address`.

        **Fixed after the first publish.** Once `course.publishedFirst` is set
        — stamped by the publish route — this is `409 address_fixed`: students,
        a syllabus and a bookmark hold the old one. Setting the address it
        already has is a `200` that writes nothing.

        An author of the course, **from a session**: a token or a connector
        gets `403 session_required`, the rule the reader password has, for the
        same reason. Event `course.address`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$' }
      responses:
        '200':
          description: Set, or already this.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { type: string }
                  address: { type: string }
                  fixed: { type: boolean, description: whether the course has published and the address is now immutable }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: |
            `address_taken` — another course in the tenant is published there;
            `address_fixed` — this course has published and the address stays;
            `course_changed` — `course.json` was written by somebody else.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/reader-password:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: getReaderPassword
      summary: The course's reader password, in clear, for an author of the course.
      description: |
        The one credential a student types to open this course's published
        notes. The user name is **the course's address**, fixed, so a class is
        told two things and neither has to be explained twice.

        It is stored in clear on purpose: the edge holds only a digest, and the
        lecturer at the podium being asked "what was the password" is the real
        case. A class credential is a secret from the log, not from its owner —
        it appears in no event, no log line and no URL. **An author of the
        course only**: an administrator too, a `viewer` gets `403
        course_read_only`, and a token or a connector gets `403
        session_required`.
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReaderPassword' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404':
          description: No reader password is set for this course.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [courses]
      operationId: putReaderPassword
      summary: Set the course's reader password. Its author, from a session.
      description: |
        Writes the digest the edge compares against and the record above, in
        that order — a record that says a password is set while the edge still
        refuses everybody would be a lie the studio then repeats. The write
        lands at the edge in seconds and nothing is deployed.

        **8 to 64 characters, printable ASCII, no colon.** Printable ASCII
        because HTTP Basic Auth has no encoding browsers agree on for anything
        else; no colon because Basic Auth joins the user name and the password
        with one. Anything else is `400 invalid_password` saying which rule.

        **The course needs an address first** — `409 address_required`, because
        the digest is keyed by it and a password set against nothing would be a
        password for no door. `PUT /courses/{c}/address` is the step before
        this one, and the publishing panel asks in that order.

        **A session only.** A token or a connector gets `403 session_required`:
        a held credential must not be able to change the door students walk
        through. Event `reader.set`, carrying not one character of it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: string, description: the course's address }
                  set: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: '`address_required` — the course has no address yet.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: |
            The edge's credential store refused the write, so nothing was
            written here either — `reader_store_unavailable`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [courses]
      operationId: deleteReaderPassword
      summary: Clear it. The published course is a 404 at the edge again.
      description: |
        Removes the digest and then the record. Publishing is refused with
        `409 reader_password_required` until a new one is set. Event
        `reader.clear`.
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: string }
                  set: { type: ['null'] }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '502':
          description: The edge's credential store refused the delete; nothing was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/lectures/{l}/theme.css:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    get:
      tags: [courses]
      operationId: getLectureThemeCss
      summary: The same stylesheet, one level deeper.
      description: |
        The preview route lives under the lecture and the shell links
        `theme.css` relatively, so both levels resolve to the one stored copy.
        Publish is what makes the real siblings on the site.
      responses:
        '200': { $ref: '#/components/responses/css' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures/{l}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    get:
      tags: [lectures]
      operationId: getLecture
      summary: The manifest, both fragments with their ETags, and the live lock.
      description: |
        The start of every edit loop. Keep the ETags: `PUT …/notes` requires
        the one that came back here.
      responses:
        '200':
          description: The lecture.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course:
                    type: object
                    description: >-
                      the course's identity and language, so a client that
                      renders the lecture knows which direction it reads and
                      which words the platform puts in it
                    properties:
                      id: { type: string }
                      lang: { type: string, enum: [he, en] }
                      dir: { type: string, enum: [rtl, ltr] }
                  manifest: { $ref: '#/components/schemas/Lecture' }
                  manifestEtag: { type: [string, 'null'] }
                  notes: { $ref: '#/components/schemas/StoredDocument' }
                  slides: { $ref: '#/components/schemas/StoredDocument' }
                  lock: { $ref: '#/components/schemas/Lock' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [lectures]
      operationId: putLecture
      summary: Create or replace a whole lecture. No ETags.
      description: |
        `studio import`: the manifest, the notes fragment and optionally the
        deck fragment in one write, appended to `course.json`'s lecture order
        if it is new. There is deliberately no `POST /courses/{c}/lectures` —
        that would be a second way to end up with notes and no manifest.
        Event `import`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                manifest: { $ref: '#/components/schemas/Lecture' }
                notes: { type: string, description: 'the notes fragment' }
                slides: { type: string, description: 'the deck fragment' }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest: { $ref: '#/components/schemas/Lecture' }
                  manifestEtag: { type: string }
                  notes: { $ref: '#/components/schemas/SaveResult' }
                  slides: { $ref: '#/components/schemas/SaveResult' }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/lectures/{l}/notes:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/ifMatch'
      - $ref: '#/components/parameters/ifNoneMatch'
      - $ref: '#/components/parameters/changedBlocks'
      - $ref: '#/components/parameters/studioClient'
    put:
      tags: [lectures]
      operationId: putNotes
      summary: Save the whole notes fragment.
      description: |
        The body is the **whole fragment**, not a patch. The server normalises
        it through the schema — which is the sanitiser — assigns `data-id` to
        blocks that have none, and writes conditionally.

        `If-Match` is **required**, with the ETag from `GET …/lectures/{l}`;
        `If-None-Match: *` creates a document that does not exist yet. Without
        either it is a `400 if_match_required`. On a lost race it is a `412`
        carrying the current ETag and who saved it, which is where the
        three-way merge starts.

        `x-changed-blocks` is the list of block ids you changed; it becomes the
        event summary and is otherwise ignored.
      requestBody:
        required: true
        content:
          text/html:
            schema: { type: string }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResult' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '412': { $ref: '#/components/responses/precondition' }

  /courses/{c}/lectures/{l}/slides:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/ifMatch'
      - $ref: '#/components/parameters/ifNoneMatch'
      - $ref: '#/components/parameters/changedBlocks'
      - $ref: '#/components/parameters/studioClient'
    put:
      tags: [lectures]
      operationId: putSlides
      summary: The same, for the deck.
      description: |
        Identical rules to `PUT …/notes`. A deck a lecture does not have yet is
        created with `If-None-Match: *`.
      requestBody:
        required: true
        content:
          text/html:
            schema: { type: string }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResult' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '412': { $ref: '#/components/responses/precondition' }

  /courses/{c}/lectures/{l}/manifest:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/ifMatchOptional'
    put:
      tags: [lectures]
      operationId: putManifest
      summary: Write `lecture.json`.
      description: |
        Validated against `lecture.schema.json`. A key the document does not
        have, or a `demos` entry that is neither `{module, export, opts?}` nor
        `{kind: file, demo}`, is a `400` whose `path` is the JSON Pointer of the
        offending key. `published` is the publish route's: a body carrying it is
        a `400`, and the stored value is carried forward for you. `id` is
        overwritten with the one in the path. Event `manifest.save`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Lecture' }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest: { $ref: '#/components/schemas/Lecture' }
                  etag: { type: string }
                  versionId: { type: string }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '412': { $ref: '#/components/responses/precondition' }

  /courses/{c}/lectures/{l}/versions:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    get:
      tags: [lectures]
      operationId: listVersions
      summary: Every stored version of both documents, joined with the event that wrote it.
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items: { $ref: '#/components/schemas/Version' }
                  slides:
                    type: array
                    items: { $ref: '#/components/schemas/Version' }

  /courses/{c}/lectures/{l}/restore:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    post:
      tags: [lectures]
      operationId: restoreVersion
      summary: Copy an old version onto the current document.
      description: |
        A restore is a new version, not a rewind: the history it came from
        stays. Event `restore`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, versionId]
              properties:
                key: { type: string, enum: [notes, slides] }
                versionId: { type: string }
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  etag: { type: string }
                  versionId: { type: string }
                  restoredFrom: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures/{l}/uploads:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    post:
      tags: [lectures]
      operationId: presignUpload
      summary: A presigned target for a figure or a data file.
      description: |
        Step one of two. Declare the name, the content type and the size; the
        answer is a URL and a set of form fields to POST the bytes to
        **directly** — the API never carries them. Then reference the file from
        the fragment as `href`, which is `figures/<name>` or `data/<name>`.

        PNG, SVG and JPEG go under `figures/`, JSON under `data/`, at most
        5 MB. The event `figure.upload` is written **here**, at the presign,
        because with S3 the bytes never touch the API and this is the last
        moment it knows anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, size]
              properties:
                name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$' }
                type:
                  type: string
                  enum: [image/png, image/svg+xml, image/jpeg, application/json]
                size: { type: integer }
                dir: { type: string, enum: [figures, data] }
      responses:
        '200':
          description: Where to post the bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignedPost' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/lectures/{l}/figures/{name}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/assetName'
    get:
      tags: [lectures]
      operationId: getFigure
      summary: A draft figure.
      description: |
        What the preview page resolves `figures/<name>` to. An SVG is
        sanitised on the way out exactly as publish sanitises it on the way in,
        so an author judges the figure they are about to publish; a clean file
        comes back byte for byte.
      responses:
        '200':
          description: The bytes.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string } }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [lectures]
      operationId: putFigure
      summary: Store a figure directly, bytes in the request.
      description: |
        The other way to put a figure beside a lecture. The two-step presign
        (`POST …/uploads`) is right for a browser, which should not send a
        megabyte through the API when it can post it to S3; it is wrong for an
        agent, which is already holding the bytes and cannot post a multipart
        form to a URL it was handed. Same allow-list, same 5 MB cap, same
        `figure.upload` event.

        The `Content-Type` is the declared type and is checked against the
        extension: PNG, SVG or JPEG here, `application/json` under `data/`.
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/svg+xml: { schema: { type: string } }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredAsset' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/lectures/{l}/data/{name}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/assetName'
    get:
      tags: [lectures]
      operationId: getData
      summary: A draft data file — numbers computed ahead of time that a demo reads instead of computing them.
      responses:
        '200':
          description: The JSON.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [lectures]
      operationId: putData
      summary: Store a data file directly, bytes in the request.
      description: |
        `putFigure` for `application/json` under `data/`. Same cap, same event.
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredAsset' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/lectures/{l}/preview:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - name: mode
        in: query
        required: false
        description: |
          `notes` (default) and `slides` are whole pages, openable in a tab.
          `preview` is the notes body only, for a client that has already
          loaded the platform CSS and renders the reading view into its own
          page.
        schema: { type: string, enum: [notes, slides, preview], default: notes }
    get:
      tags: [lectures]
      operationId: getPreview
      summary: The shell around the draft.
      description: |
        The same renderer that publishes, so what you see here cannot drift
        from what a student gets. `Cache-Control: no-store`, because a cached
        preview of a draft is a lie.
      responses:
        '200':
          description: The page.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures/{l}/publish:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    post:
      tags: [publish]
      operationId: publishLecture
      summary: Render the draft onto the site and start the print job.
      description: |
        Copies an explicit list — the shelled `notes.html`, the shelled
        `slides.html` if there is one, `figures/*`, `data/*` and `theme.css` —
        into the site area, writes `manifest.published`, and answers `202` with
        a job id. Poll `GET …/publish/{job}` until it is `done` or `failed`.

        The copy has already happened when you get the `202`. What is still
        running is the PDF, and **a failed print is a failed job, not a failed
        publish**: the pages are live either way and the job record says so.

        **Two refusals before a single key is copied, in this order.** `409
        address_required` — the course has no published address yet, and every
        site key, the edge's lookup and the reader user name are that address.
        Then `409 reader_password_required` — the edge admits a course prefix
        only when its credential is in the store, so publishing without one
        would put a lecture on the CDN that every student gets a 404 for. Both
        are set in the publishing panel on the course page, in that order
        (`PUT /courses/{c}/address`, then `PUT /courses/{c}/reader-password`).

        Everything written to the site is under the **address**: `<address>/<lecture>/…`,
        the course-root `theme.css` and the front page's links. The first
        publish stamps `course.publishedFirst`, which fixes the address.

        Events `publish.start`, then `publish.done` or `publish.failed`.
      responses:
        '202':
          description: Accepted; the pages are on the site and the print is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { type: string }
                  status: { type: string, enum: [copying, rendering, done, failed] }
                  site: { type: string }
                  keys: { type: array, items: { type: string } }
                  published: { $ref: '#/components/schemas/Published' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: |
            `address_required` — the course has no published address; then
            `reader_password_required` — it has no reader password. Nothing was
            copied either way. `course` names it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/lectures/{l}/publish/{job}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - name: job
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Z0-9]{4,40}$' }
    get:
      tags: [publish]
      operationId: getPublishJob
      summary: The job, while it runs and after it stops.
      description: '`copying` → `rendering` → `done` | `failed`.'
      responses:
        '200':
          description: The job record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures/{l}/notes-thread:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    get:
      tags: [threads]
      operationId: getNotesThread
      summary: The author notes on this lecture.
      description: |
        Never published. This is where to leave a question instead of guessing
        at the subject: anchor it to the block you are unsure about and say
        what you would do.
      responses:
        '200':
          description: The thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
    post:
      tags: [threads]
      operationId: addNote
      summary: Add a note.
      description: 'Event `note.add`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                anchor: { $ref: '#/components/schemas/Anchor' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/busy' }

  /courses/{c}/lectures/{l}/notes-thread/{id}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [threads]
      operationId: patchNote
      summary: Reply, resolve, reopen, or edit your own note.
      description: |
        One of `reply`, `status` or `body` per call. Editing `body` is the
        note's author's alone. Events `note.reply`, `note.resolve`,
        `note.reopen`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reply: { type: string }
                status: { type: string, enum: [open, done] }
                body: { type: string }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/busy' }
    delete:
      tags: [threads]
      operationId: deleteNote
      summary: Remove a note and its replies. The note's author only.
      description: 'Event `note.delete`.'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/busy' }

  /courses/{c}/lectures/{l}/lock:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    post:
      tags: [lectures]
      operationId: acquireLock
      summary: Take or refresh the soft lock.
      description: |
        Not a mutex — a courtesy. Holding it gives you nothing; saving is still
        governed by `If-Match`. What it buys is a banner before someone starts
        typing rather than a conflict after. Five minutes, refreshed by an open
        editor every sixty seconds. Only taking it writes an event
        (`lock.acquire`).
      responses:
        '200':
          description: Held.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lock: { $ref: '#/components/schemas/Lock' }
                  refreshed: { type: boolean }
        '403': { $ref: '#/components/responses/forbidden' }
        '409':
          description: Someone else has it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [lectures]
      operationId: releaseLock
      summary: Release the lock. The holder's only.
      description: 'Event `lock.release`.'
      responses:
        '204':
          description: Released, or there was nothing to release.
        '403': { $ref: '#/components/responses/forbidden' }

  /events:
    get:
      tags: [session]
      operationId: listEvents
      summary: The activity feed, newest first, capped at 200.
      description: |
        One record per mutation, append-only. Every route that changes anything
        writes one before it answers, so this is the honest record of what
        happened and who did it.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: strictly newer than this instant
        - name: course
          in: query
          schema: { type: string }
        - name: lecture
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 200, default: 200 }
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  count: { type: integer }

  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: The caller's own access tokens, never the hash.
      description: |
        A session only — a token asking is 403 `session_required`, so a leaked
        credential cannot enumerate its siblings. Each row carries a `state`
        (`active` · `expired` · `revoked`) computed at read time.
      responses:
        '200':
          description: The caller's tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/Token' }
        '403': { $ref: '#/components/responses/forbidden' }
    post:
      tags: [tokens]
      operationId: mintToken
      summary: Mint an access token. The secret is in this response and nowhere else.
      description: |
        Defaults: all three scopes, every course the owner can see, no expiry.
        `courses` must be `["*"]` or a subset of the owner's courses (400
        `unknown_course` otherwise). The groups are the minting session's,
        copied verbatim, so a token is never more than its owner was. Event
        `token.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 60 }
                scopes:
                  type: array
                  items: { type: string, enum: [read, write, publish] }
                courses:
                  type: array
                  items: { type: string }
                expires: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Minted. `secret` is shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: '#/components/schemas/Token' }
                  secret: { type: string, description: '`cst_<ulid>_<secret>`; store it, it is not retrievable' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke one of the caller's own tokens.
      description: |
        Someone else's is a 404, not a 403 — the id space is not enumerable.
        Conditional on the record's ETag with one retry; a third writer is 409
        `token_busy`. Event `token.revoke`. Takes effect within the authorizer's
        cache window (60 s deployed).
      responses:
        '200':
          description: 'Revoked (or already was — `alreadyRevoked: true`).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: '#/components/schemas/Token' }
                  alreadyRevoked: { type: boolean }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: Two writers raced twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /access:
    get:
      tags: [access]
      operationId: listAccess
      summary: Every access record. Administrators, sessions only.
      responses:
        '200':
          description: The records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRecord' }
        '403': { $ref: '#/components/responses/forbidden' }

  /access/{email}:
    parameters:
      - name: email
        in: path
        required: true
        description: Lower-cased on the way in; two spellings are one record.
        schema: { type: string, format: email }
    get:
      tags: [access]
      operationId: getAccess
      summary: One user's record.
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRecord' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [access]
      operationId: putAccess
      summary: Replace the user's roles map. Creates the record.
      description: |
        The whole map, deliberately: the record says what the last administrator
        decided. Read-modify-write server side with three retries. Event
        `access.grant`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: object
                  additionalProperties: { type: string, enum: [author, viewer] }
                courseLimit:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 1000
                  description: |
                    How many courses this user may open with `POST /courses`;
                    `null` returns them to the default (ten). Absent leaves
                    it alone. `opened` is not writable here.
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRecord' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
    delete:
      tags: [access]
      operationId: deleteAccess
      summary: Remove the record — the user sees no course afterwards.
      description: 'Event `access.revoke`.'
      responses:
        '204':
          description: Removed.
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/members:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: listMembers
      summary: Who has which role on this course. Authors and administrators.
      description: |
        The one read a `viewer` is refused (403): a lecturer may see who reads
        their drafts; a student may not enumerate the course.
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        email: { type: string }
                        role: { type: string, enum: [author, viewer] }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/demos:
    get:
      summary: Every demo in the course, with the lectures that wire each one
      operationId: listDemos
      parameters: [{ $ref: '#/components/parameters/course' }]
      responses:
        '200':
          description: The course's demo library
          content:
            application/json:
              schema:
                type: object
                required: [course, demos]
                properties:
                  course: { type: string }
                  demos:
                    type: array
                    items: { $ref: '#/components/schemas/DemoListing' }

  /courses/{c}/demos/{slug}:
    get:
      summary: One demo's manifest, the ETags of its three files, and its usedIn
      operationId: getDemo
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The demo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoListing' }
        '404': { description: No such demo }
    put:
      summary: Create or update demo.json; the slug in the path wins
      operationId: putDemo
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
        - { $ref: '#/components/parameters/ifMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoManifest' }
      responses:
        '200': { description: Updated }
        '201': { description: Created }
        '400': { description: invalid_slug, title_required or invalid_aspect }
        '412': { description: The If-Match did not hold }
        '413': { description: too_large — demo.json is capped at 4 KB }
    delete:
      summary: Remove all three files, unless a lecture wires the demo
      operationId: deleteDemo
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200': { description: Deleted, with the keys that were removed }
        '404': { description: No such demo }
        '409':
          description: demo_in_use — the body carries `usedIn`, the lectures that wire it

  /courses/{c}/demos/{slug}/demo.html:
    get:
      summary: The draft document, served with the demo CSP and no x-frame-options
      operationId: getDemoHtml
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The file
          headers:
            Content-Security-Policy:
              schema: { type: string }
              description: The demo CSP (`src/demoCsp.js`) — no origin except frame-ancestors
          content:
            text/html: { schema: { type: string } }
        '404': { description: No such demo, or no document uploaded yet }
    put:
      summary: Upload the document; a demo.json must exist first
      operationId: putDemoHtml
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
        - { $ref: '#/components/parameters/ifMatch' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      requestBody:
        required: true
        content:
          text/html: { schema: { type: string } }
      responses:
        '200': { description: Written }
        '400': { description: invalid_type or empty_body }
        '404': { description: No demo.json for this slug }
        '412': { description: The condition did not hold }
        '413': { description: too_large — 2 MB }

  /courses/{c}/demos/{slug}/still.png:
    get:
      summary: The draft still frame
      operationId: getDemoStill
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The file
          content:
            image/png: { schema: { type: string, format: binary } }
        '404': { description: No such demo, or no still uploaded yet }
    put:
      summary: Upload the still frame
      operationId: putDemoStill
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
        - { $ref: '#/components/parameters/ifMatch' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
      responses:
        '200': { description: Written }
        '400': { description: invalid_type or invalid_png }
        '404': { description: No demo.json for this slug }
        '413': { description: too_large — 1 MB }

  /courses/{c}/lectures/{l}/demos/{slug}/demo.html:
    get:
      summary: The same document at a lecture-relative path, for the preview
      description: >-
        The preview page is shelled with relative asset paths, so
        `demos/<slug>/demo.html` in its boot resolves against the lecture's own
        route — exactly as `figures/` does. The bytes are the same object.
      operationId: getLectureDemoHtml
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/lecture' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The file, with the demo CSP
          content:
            text/html: { schema: { type: string } }
        '404': { description: No such demo }

  /courses/{c}/lectures/{l}/demos/{slug}/still.png:
    get:
      summary: The same still at a lecture-relative path
      operationId: getLectureDemoStill
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/lecture' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The file
          content:
            image/png: { schema: { type: string, format: binary } }
        '404': { description: No such demo }

  /courses/{c}/demos/{slug}/demo.json:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/slug'
    get:
      tags: [demos]
      operationId: getDemoManifestFile
      summary: The raw demo.json, exactly as stored.
      description: |
        `GET /courses/{c}/demos/{slug}` dresses the manifest for the studio —
        ETags of the three files, `usedIn` — which is the wrong shape to write
        to disk. `studio demos pull` wants the three files the format defines,
        so the raw one is served beside `demo.html` and `still.png`.
      responses:
        '200':
          description: The manifest file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoManifest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /mcp:
    post:
      tags: [mcp]
      operationId: postMcp
      summary: The MCP server — one JSON-RPC request in, one JSON response out.
      security: []
      description: |
        **Streamable HTTP, stateless** (spec revision 2026-07-28, which dropped
        sessions and the server-initiated stream). There is no `Mcp-Session-Id`
        and there is nothing to keep between calls, which is what lets this be
        one Lambda behind a gateway that closes a connection at thirty seconds.

        This route authenticates **itself**, which is why `security` here is
        empty rather than the document's default: an HTTP API's authorizer
        cannot put a header on its own 401, and OAuth discovery begins with a
        401 carrying
        `WWW-Authenticate: Bearer resource_metadata="…/.well-known/oauth-protected-resource/api/mcp"`.
        Two credentials are accepted — a Cognito **access** token from the
        `studio-connector` app client, whose scopes `studio/read`,
        `studio/write` and `studio/publish` become this API's `read`, `write`
        and `publish`; and a `cst_…` studio access token, for a shell agent
        that would rather speak MCP than HTTP.

        Every tool is dispatched back through this API's own router with the
        verified identity, so the group rule, the scopes, the course grants,
        the ETag rules, the sanitiser and the event log apply to a tool call
        exactly as they apply to a request off the wire. Events carry
        `via: { connector }` and `client: mcp/<sdk version>`.

        A body of notifications alone is answered `202` with no body.
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          description: The revision the client speaks. Echoed back on the response.
          schema: { type: string }
        - name: Mcp-Method
          in: header
          required: false
          description: A hint naming the JSON-RPC method, for logs and rate limits.
          schema: { type: string }
        - name: Mcp-Name
          in: header
          required: false
          description: A hint naming the tool or resource, for logs and rate limits.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: One JSON-RPC 2.0 message, or an array of them.
              oneOf:
                - type: object
                - type: array
                  items: { type: object }
      responses:
        '200':
          description: The JSON-RPC response.
          headers:
            MCP-Protocol-Version:
              description: The revision the client declared, echoed.
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                  - type: array
                    items: { type: object }
        '202':
          description: Notifications only; nothing to answer.
        '400':
          description: The body was not JSON-RPC. A JSON-RPC error object, not this API's error shape.
          content:
            application/json:
              schema: { type: object }
        '401':
          description: |
            No credential, or one this pool will not vouch for. Carries
            `WWW-Authenticate: Bearer resource_metadata="…"`, which is where a
            connector starts its sign-in.
          headers:
            WWW-Authenticate:
              description: '`Bearer resource_metadata="<origin>/.well-known/oauth-protected-resource/api/mcp"`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/badRequest' }
    get:
      tags: [mcp]
      operationId: getMcp
      summary: 405 — this server is stateless and opens no stream.
      security: []
      responses:
        '405':
          description: '`Allow: POST, DELETE`. There is no server-initiated stream to subscribe to.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [mcp]
      operationId: deleteMcp
      summary: 204 — there is no session to end.
      security: []
      responses:
        '204':
          description: Nothing to do, and saying so is friendlier than a 404.

  /.well-known/oauth-protected-resource/api/mcp:
    servers:
      - url: /
        description: |
          The origin, not `/api`. RFC 9728 puts a resource's metadata at
          `/.well-known/oauth-protected-resource` plus the resource URL's own
          path, so this document lives beside the site and a CloudFront
          behaviour routes it to this API (`infra/lib/edge-stack.ts`).
    get:
      tags: [mcp]
      operationId: getProtectedResourceMetadata
      summary: Where to sign in for /api/mcp.
      security: []
      description: |
        RFC 9728 §2, and public by specification. `resource` is exactly the URL
        a connector calls and exactly the value it sends as the RFC 8707
        `resource` parameter on the authorize and token requests;
        `authorization_servers` is this origin, whose
        `/.well-known/oauth-authorization-server` the client reads next —
        the pool's endpoints with the PKCE line Cognito leaves out.
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                type: object
                required: [resource, authorization_servers, scopes_supported]
                properties:
                  resource: { type: string, format: uri }
                  authorization_servers:
                    type: array
                    items: { type: string, format: uri }
                  scopes_supported:
                    type: array
                    items: { type: string }
                  bearer_methods_supported:
                    type: array
                    items: { type: string, enum: [header] }
                  resource_documentation: { type: string, format: uri }

  /.well-known/oauth-authorization-server:
    servers:
      - url: /
    get:
      tags: [mcp]
      operationId: getAuthorizationServerMetadata
      summary: The authorization server's metadata, published by the resource.
      security: []
      description: |
        RFC 8414. Cognito supports PKCE and does not advertise it, and an MCP
        client must refuse an authorization server whose metadata omits
        `code_challenge_methods_supported` — so this API publishes the pool's
        endpoints itself, verbatim, plus that one line. `issuer` is this
        origin, the value `authorization_servers` names.
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema: { type: object }
  /.well-known/openid-configuration:
    servers:
      - url: /
    get:
      tags: [mcp]
      operationId: getOpenIdConfiguration
      summary: The same document under the OpenID discovery name.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema: { type: object }

components:

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Two kinds of credential reach this API, and every route takes either:

        - a **Cognito ID token**, which is what the studio SPA and
          `studio login` send. The actor is the `email` claim and the groups
          are `cognito:groups`.
        - a **studio access token**, minted in the studio and held by an agent,
          scoped to `read` / `write` / `publish` and optionally to one course.
          It is shown once, at mint, and only its hash is stored; the event log
          carries the token's id and label, never the secret.

        On the local dev server there is no token at all: the header
        `x-dev-user: you@example.com` is the actor, and `x-dev-groups: viewers`
        makes it a read-only session. The server binds to localhost.

  parameters:
    slug:
      name: slug
      in: path
      required: true
      description: The demo's id in the course, and the folder it lives in.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,39}$' }
    course:
      name: c
      in: path
      required: true
      description: the course id, a folder name
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$' }
    lecture:
      name: l
      in: path
      required: true
      description: the lecture id, a folder name such as `L02-damped-driven`
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$' }
    guideName:
      name: name
      in: path
      required: true
      schema: { type: string, enum: [conventions, glossary, syllabus, style] }
    assetName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$' }
    ifMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The ETag from the `GET`. Required on a document save unless
        `If-None-Match: *` is sent instead.
      schema: { type: string }
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: '`*` to create a document that does not exist yet.'
      schema: { type: string, enum: ['*'] }
    ifMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Optional here; honoured when sent.
      schema: { type: string }
    changedBlocks:
      name: x-changed-blocks
      in: header
      required: false
      description: |
        The ids of the blocks this save changed, comma-separated or as a JSON
        array. Becomes the event summary. `?changed=a,b,c` does the same.
      schema: { type: string }
    studioClient:
      name: x-studio-client
      in: header
      required: false
      description: Recorded on the event, so history can say what wrote a block.
      schema: { type: string }

  headers:
    ETag:
      description: The quoted sha-1 of the body. Send it back as `If-Match`.
      schema: { type: string }

  responses:
    unauthenticated:
      description: No session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    forbidden:
      description: |
        A `viewers` session tried to write, or an actor tried something that is
        someone else's (a lock, another author's note, another author's brief).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    notFound:
      description: No such thing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    badRequest:
      description: The request could not be acted on; `error` says which rule it broke.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    invalidDocument:
      description: |
        The document failed its JSON Schema. `path` is the JSON Pointer of the
        offending key and `errors` carries up to ten of them.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    precondition:
      description: |
        Someone saved since you read. `etag` is what the store holds now and
        `actor` and `ts` are who wrote it. Re-`GET`, re-apply your change,
        and save again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PreconditionError' }
    tooLarge:
      description: Over the cap for this kind of document.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    busy:
      description: |
        A concurrent write could not be reconciled in three attempts, or the
        document is in a state that refuses this change.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    css:
      description: The stylesheet.
      content:
        text/css:
          schema: { type: string }

  schemas:
    ReaderPassword:
      type: object
      description: |
        A course's reader credential as its author reads it back. The user name
        is the course id; the password is the one a student types at the edge's
        prompt.
      required: [user, password, set]
      properties:
        user: { type: string, description: the course id, fixed }
        password: { type: string }
        set: { type: string, format: date-time }
        by: { type: [string, 'null'], description: who set it }
    StoredAsset:
      type: object
      description: What a direct `PUT` of a figure or a data file answers with.
      required: [key, href, bytes, contentType]
      properties:
        key: { type: string, description: the store key }
        href: { type: string, description: '`figures/<name>` — what the fragment should point at' }
        bytes: { type: integer }
        contentType: { type: string }
        maxBytes: { type: integer, description: the cap, 5 MB }
        etag: { type: string }
        versionId: { type: [string, 'null'] }
    DemoManifest:
      type: object
      required: [title]
      properties:
        slug:
          type: string
          description: Ignored on a PUT — the path is the key.
          pattern: '^[a-z0-9][a-z0-9-]{1,39}$'
        title: { type: string, description: 'May be Hebrew; it is what the gallery lists.' }
        description: { type: string }
        aspect:
          type: number
          description: height ÷ width; the frame is sized from it. Default 0.5.
          minimum: 0.05
          maximum: 3
        author: { type: string }
        version: { type: string }

    DemoListing:
      allOf:
        - $ref: '#/components/schemas/DemoManifest'
        - type: object
          properties:
            usedIn:
              type: array
              description: The lectures whose manifest wires this demo.
              items: { type: string }
            hasHtml: { type: boolean }
            hasStill: { type: boolean }
            etag: { type: string }
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string }
            etags:
              type: object
              description: 'Per-file ETags, on the single-demo GET only.'
              additionalProperties: { type: [string, 'null'] }
    Token:
      type: object
      description: An access token's public half. `hash` is never served.
      properties:
        id: { type: string, description: ULID }
        label: { type: string }
        owner: { type: string }
        groups: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string, enum: [read, write, publish] } }
        courses: { type: array, items: { type: string }, description: '`["*"]` or course ids' }
        prefix: { type: string, description: '`cst_<ulid>` — the public half, what a log line shows' }
        created: { type: string, format: date-time }
        expires: { type: [string, 'null'], format: date-time }
        lastUsed: { type: [string, 'null'], format: date-time }
        revoked: { type: [string, 'null'], format: date-time }
        state: { type: string, enum: [active, expired, revoked] }
    AccessRecord:
      type: object
      properties:
        email: { type: string }
        roles:
          type: object
          additionalProperties: { type: string, enum: [author, viewer] }
        opened:
          type: array
          items: { type: string }
          description: the courses this user opened with `POST /courses`; the cap counts these
        courseLimit:
          type: [integer, 'null']
          description: an administrator's override of the default cap (ten), or null
        created: { type: [string, 'null'], format: date-time }
        updated: { type: [string, 'null'], format: date-time }
        grantedBy: { type: [string, 'null'] }

    Error:
      type: object
      required: [error, message]
      description: |
        The one error shape. `error` is a stable code; `message` is a sentence.
        Codes in use: `unauthenticated`, `forbidden`, `not_found`, `no_route`,
        `method_not_allowed`, `invalid_id`, `invalid_key`, `invalid_json`,
        `empty_body`, `if_match_required`, `precondition`, `locked`,
        `not_lock_holder`, `thread_busy`, `invalid_name`, `invalid_type`,
        `extension_mismatch`, `wrong_folder`, `too_large`, `invalid_mode`,
        `invalid_job`, `invalid_guide`, `invalid_manifest`, `invalid_course`,
        `invalid_theme`, `invalid_preset`, `invalid_token`, `invalid_colour`,
        `invalid_font`, `invalid_weight`, `bad_signature`, `key_not_allowed`,
        `internal`.
      properties:
        error: { type: string }
        message: { type: string }

    ValidationError:
      type: object
      properties:
        error: { type: string, enum: [invalid_manifest, invalid_course] }
        message: { type: string }
        path: { type: string, description: 'JSON Pointer, e.g. /demos/#demo-damped/exports' }
        schema: { type: string, format: uri }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }

    PreconditionError:
      type: object
      properties:
        error: { type: string, enum: [precondition] }
        message: { type: string }
        etag: { type: [string, 'null'] }
        actor: { type: [string, 'null'] }
        ts: { type: [string, 'null'], format: date-time }

    Course:
      type: object
      description: '`course.json`. The authority is `docs/api/course.schema.json`.'
      required: [id]
      properties:
        id: { type: string, description: 'generated by POST /courses; the store key and the studio URL, never a student URL' }
        address:
          type: [string, 'null']
          description: >-
            the published prefix — the URL students read, the edge's key and
            the reader user name. Null until an author sets it with
            `PUT /courses/{c}/address`, and fixed once `publishedFirst` is set.
        publishedFirst:
          type: [string, 'null']
          format: date-time
          description: when the course was first published; what fixes the address
        title: { type: string }
        lang:
          type: string
          enum: [he, en]
          description: |
            The language the course is written in, chosen when it is opened and
            fixed after that. Everything downstream reads it: the page's
            `lang`/`dir`, the words the platform puts on a student's page, and
            the language the editor writes placeholders in. A course stored
            without one reads as `he` — the migration for every course opened
            before 2026-09-17.
        dir:
          type: string
          enum: [rtl, ltr]
          description: |
            The reading direction, **derived** from `lang` (`he` → `rtl`,
            `en` → `ltr`) and stored so a page and a stylesheet need not
            compute it. A body whose `dir` disagrees with its `lang` is a
            `400 invalid_course` at `/dir`.
        titleEn:
          type: [string, 'null']
          description: >-
            the Latin-script title, shown in its own bidi isolate; used by a
            Hebrew course. An English course does not need it.
        term: { type: [string, 'null'] }
        lecturer: { type: [string, 'null'] }
        theme: { $ref: '#/components/schemas/Theme' }
        platform: { type: string, description: 'the platform hash a published page loads' }
        lectures:
          type: array
          items: { type: string }
          description: "the lecture ids in the lecturer's own order"

    Lecture:
      type: object
      description: |
        `lecture.json`, the manifest. The authority is
        `docs/api/lecture.schema.json`, which this repeats loosely; the API
        validates against that file and not against this.
      required: [id]
      properties:
        id: { type: string }
        number: { type: integer }
        title: { type: string }
        docTitle: { type: string }
        slidesTitle: { type: [string, 'null'] }
        kicker: { type: array, items: { type: string } }
        reading: { type: string }
        demos: { $ref: '#/components/schemas/DemoMap' }
        slideDemos: { $ref: '#/components/schemas/DemoMap' }
        published: { $ref: '#/components/schemas/Published' }

    DemoMap:
      type: object
      description: |
        Keyed by the selector of the empty `<div>` in the fragment
        (`#demo-damped`). A value is `{kind: file, demo}` — one of the
        course's own demos, by slug — with `aspect` and `title` copied off
        that demo's `demo.json` when it was wired, because a published page
        has no API to ask. The shape that named a class in the platform
        bundle (`{module, export, opts}`) was removed on 2026-09-16; a body
        carrying one is a `400` whose message names the slug to wire instead.
      additionalProperties:
        type: object
        required: [kind, demo]
        properties:
          kind: { type: string, enum: [file] }
          demo: { type: string }
          aspect: { type: number }
          title: { type: string }

    Published:
      type: [object, 'null']
      description: |
        Written by the publish route and read-only to every client: a body
        carrying it is a `400`.
      properties:
        at: { type: string, format: date-time }
        version: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }

    LectureSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: [string, 'null'] }
        number: { type: [integer, 'null'] }
        lastModified: { type: [string, 'null'], format: date-time }
        actor: { type: [string, 'null'] }
        lastAction: { type: [string, 'null'] }
        published: { $ref: '#/components/schemas/Published' }
        openNotes: { type: integer }
        hasSlides: { type: boolean }

    GuideEntry:
      type: object
      properties:
        name: { type: string, enum: [conventions, glossary, syllabus, style] }
        size: { type: [integer, 'null'] }
        lastModified: { type: [string, 'null'], format: date-time }
        etag: { type: [string, 'null'] }

    StoredDocument:
      type: [object, 'null']
      description: A fragment as the store holds it. `null` when there is none.
      properties:
        body: { type: string }
        etag: { type: string }
        versionId: { type: string }

    SaveResult:
      type: object
      properties:
        etag: { type: string }
        versionId: { type: string }
        idsAssigned: { type: integer, description: 'blocks that arrived with no data-id' }
        bytes: { type: integer }

    Version:
      type: object
      properties:
        versionId: { type: string }
        lastModified: { type: string, format: date-time }
        etag: { type: string }
        size: { type: integer }
        actor: { type: [string, 'null'] }
        ts: { type: [string, 'null'], format: date-time }
        action: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }

    Lock:
      type: [object, 'null']
      properties:
        actor: { type: string }
        acquired: { type: string, format: date-time }
        expires: { type: string, format: date-time }

    PresignedPost:
      type: object
      description: |
        Step one of the two-step upload. POST the bytes to `url` as
        `multipart/form-data` with every entry of `fields` first and the file
        last. Locally `url` is `/api/_upload?…&sig=…`, which is the stand-in
        for the presigned S3 POST and is authorised by its signature rather
        than by a session.
      properties:
        key: { type: string }
        url: { type: string }
        fields: { type: object }
        maxBytes: { type: integer }
        contentType: { type: string }
        href: { type: string, description: 'how the fragment should refer to it' }

    PublishJob:
      type: object
      properties:
        job: { type: string }
        status: { type: string, enum: [copying, rendering, done, failed] }
        actor: { type: string }
        course: { type: string }
        lecture: { type: string }
        site: { type: string }
        started: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        keys: { type: array, items: { type: string } }
        published: { $ref: '#/components/schemas/Published' }
        pdf: { type: [string, 'null'] }
        print: { type: [string, 'null'] }
        error: { type: [string, 'null'] }

    Anchor:
      type: object
      description: Where a note points. Resolved by block id, else by the quote.
      properties:
        section: { type: [string, 'null'] }
        block: { type: [string, 'null'] }
        quote: { type: [string, 'null'] }

    Note:
      type: object
      properties:
        id: { type: string }
        author: { type: string }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        status: { type: string, enum: [open, done] }
        anchor: { $ref: '#/components/schemas/Anchor' }
        body: { type: string }
        replies:
          type: array
          items:
            type: object
            properties:
              author: { type: string }
              created: { type: string, format: date-time }
              body: { type: string }

    Thread:
      type: object
      properties:
        notes:
          type: array
          items: { $ref: '#/components/schemas/Note' }
        etag: { type: string }

    Theme:
      type: object
      description: |
        A course's token set over `shared/theme/aegean.css`. The presets are
        `aegean`, `chalk`, `spectrum` and `phase`; only vendored faces are
        selectable, because the site's CSP is `font-src 'self' data:`.
      properties:
        base: { type: string, enum: [aegean] }
        preset: { type: string, enum: [aegean, chalk, spectrum, phase] }
        overrides:
          type: object
          description: token → `#RRGGBB`, for the twelve roles only
          additionalProperties: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        fonts:
          type: object
          properties:
            display: { type: string }
            displayWeight: { type: integer }
            body: { type: string }

    ThemeResponse:
      type: object
      description: Everything the theme panel draws, in one answer.
      properties:
        theme: { $ref: '#/components/schemas/Theme' }
        effective: { type: object }
        fontsResolved: { type: object }
        name: { type: string }
        css: { type: string }
        presets: { type: array, items: { type: object } }
        roles: { type: array, items: { type: array, items: { type: string } } }
        fonts: { type: object }
        verdict:
          type: object
          description: 'the colour-vision check; a failing one is reported, never refused'
          properties:
            level: { type: string, enum: [ok, warn, fail] }
            issues: { type: array, items: { type: string } }
            mode: { type: [string, 'null'] }

    Event:
      type: object
      description: |
        One record per mutation. `action` is one of `notes.save`,
        `slides.save`, `manifest.save`, `course.save`, `figure.upload`,
        `theme.save`, `guide.save`, `publish.start`, `publish.done`,
        `publish.failed`, `restore`, `note.add`, `note.reply`, `note.resolve`,
        `note.reopen`, `note.delete`, `lock.acquire`, `lock.release`, `import`,
        `access.grant`, `access.revoke`, `token.create`, `token.revoke`,
        `demo.save`, `demo.file`, `demo.delete`.
      properties:
        ts: { type: string, format: date-time }
        actor: { type: [string, 'null'] }
        tenant: { type: string }
        course: { type: [string, 'null'] }
        lecture: { type: [string, 'null'] }
        action: { type: string }
        key: { type: [string, 'null'] }
        version: { type: [string, 'null'] }
        etag: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        bytes: { type: [integer, 'null'] }
        client: { type: [string, 'null'] }
