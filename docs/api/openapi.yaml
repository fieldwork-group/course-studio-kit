# The Course Studio API, as a machine can read it.
#
# Hand-written, one operation per registered route, and held to that by
# `test/openapi.test.js`: it walks the router's own `(method, path)` pairs and
# asserts the set equals the set of operations here, both ways. A route with no
# entry fails the suite; an entry with no route fails it too. That test is the
# `check:demos` of the API — a stale spec looks fine in review and sends an
# agent to a 404.
#
# Served at `GET /openapi.json`. The YAML is converted at build time
# (`npm run build:openapi`, `tools/openapi.js`) into `src/openapi.generated.js`,
# which is what the Lambda imports: nothing on a request path parses YAML.
# `info.version` is written from `package.json` by that build, so it cannot
# drift from the package it describes.
#
# The prose an agent needs *around* these routes — the edit loop, the block-id
# discipline, what a 422 means — is `docs/api/agent-guide.md`. This file is the
# shape of every request and answer; that one is how to use them.

openapi: 3.1.0

info:
  title: Course Studio API
  version: 0.0.0
  summary: Edit, preview and publish Hebrew lecture notes and decks.
  description: |
    One handler over a versioned object store. Everything a lecture is — the
    notes fragment, the deck fragment, the manifest, the figures, the author
    notes thread — is read and written here, by the studio SPA, by the
    `studio` CLI, and by an agent holding a token.

    Three things govern every call:

    - **The tenant is never in the path.** It is fixed in the deployment, so
      the IAM policy `tenants/<t>/*` means something.
    - **Every write needs the `authors` group.** A `viewers` session may read
      everything, including drafts, and is refused every non-GET by method.
      There are no per-route exceptions.
    - **A document save is conditional.** `PUT …/notes` and `PUT …/slides`
      require `If-Match` with the ETag from the `GET` (or `If-None-Match: *`
      to create), and answer `412` with the current ETag and who wrote it.

    Errors are always `{ error, message, ... }` — the code in `error` is
    stable, `message` is a sentence for a person, and some codes carry extra
    keys (`etag` and `actor` on a 412, `path` on a validation failure).
  license:
    name: Proprietary — Fieldwork
  x-guides:
    agent: docs/api/agent-guide.md
    vocabulary: docs/api/vocabulary.md
    lecture: docs/api/lecture.schema.json
    course: docs/api/course.schema.json

servers:
  - url: /api
    description: Same origin as the studio SPA and the published site.

security:
  - bearer: []

tags:
  - name: session
    description: Who is asking.
  - name: contract
    description: The API describing itself.
  - name: courses
    description: A course, its theme and its guides.
  - name: lectures
    description: The documents, their history and their assets.
  - name: exercises
    description: A sheet of questions, its private key, and what each question is worth.
  - name: grading
    description: Submissions, the review of one, the release and the gradebook. An author's.
  - name: publish
    description: Draft to student-visible page.
  - name: threads
    description: Author notes on a block.
  - name: dev
    description: The local stand-ins for presigned S3 URLs. Not deployed.
  - name: workspace
    description: |
      A student's own surface — their submissions and their released grades.
      Everything under `/courses/{c}/me/`, and the whole of what a `students`
      session may reach.
  - name: public
    description: What a visitor with no account may read.

paths:

  /openapi.json:
    get:
      tags: [contract]
      operationId: getOpenapi
      summary: This document, as JSON.
      description: |
        The spec the deployment is actually running, with `info.version` equal
        to the API package's version. Any `read` may fetch it.
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        '401': { $ref: '#/components/responses/unauthenticated' }

  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: The signed-in actor, their groups and the tenant.
      description: |
        The first call of any client. `groups` decides what the rest of the
        API will allow: `authors` writes, `viewers` reads.
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                type: object
                required: [actor, groups, tenant]
                properties:
                  actor: { type: string, description: 'the email claim' }
                  groups:
                    type: array
                    items: { type: string, enum: [authors, viewers] }
                  tenant: { type: string }
                  opened:
                    type: array
                    items: { type: string }
                    description: the courses the caller opened with `POST /courses` (empty for an administrator)
                  courseLimit:
                    type: [integer, 'null']
                    description: how many the caller may open in all; null for an administrator, who is not counted
                  dev: { type: boolean, description: 'true on the local dev server' }
                  connector:
                    type: string
                    description: |
                      The OAuth client id, when the caller came in through
                      `POST /mcp` as a connector. Absent for a session and for
                      an access token. Public by design; the secret beside it
                      is not, and appears in no response at all.
        '401': { $ref: '#/components/responses/unauthenticated' }

  /public/courses:
    get:
      tags: [public]
      operationId: listPublicCourses
      summary: The published courses, with a link per published lecture.
      description: |
        **No credential.** The only route on this API that needs none: it is
        what the studio's landing page draws for a signed-out visitor, and the
        gateway reaches it without the authorizer.

        Only **published** lectures appear, computed from `published` on each
        lecture manifest exactly as `GET /courses/{c}` computes it, and a
        course with no published lecture is not listed at all. Nothing from a
        draft is in the answer — no notes, no guides, no members, no grants,
        no publish version. `GET /courses` is the other list and is not this
        one: it is filtered by the caller's grants and carries draft state.

        `site` is the origin the published notes are served from, and each
        lecture's `url` is `site + /<course>/<lecture>/notes` — the page
        `POST …/publish` wrote. `cache-control: public, max-age=300`.
      security: []
      responses:
        '200':
          description: The published courses.
          content:
            application/json:
              schema:
                type: object
                required: [site, courses]
                properties:
                  site:
                    type: string
                    description: 'the origin the published notes are on, no trailing slash'
                  courses:
                    type: array
                    items:
                      type: object
                      required: [id, title, titleEn, term, lecturer, lang, lectures]
                      properties:
                        id: { type: string }
                        title: { type: [string, 'null'], description: 'the Hebrew name' }
                        titleEn: { type: [string, 'null'] }
                        term: { type: [string, 'null'] }
                        lecturer: { type: [string, 'null'] }
                        lang: { type: string, description: "the course language, `he` unless it says otherwise" }
                        lectures:
                          type: array
                          description: 'the published lectures, in lecture-number order'
                          items:
                            type: object
                            required: [id, number, title, url, publishedAt]
                            properties:
                              id: { type: string }
                              number: { type: [integer, 'null'] }
                              title: { type: [string, 'null'] }
                              url: { type: string, description: 'the notes page on the courses site' }
                              publishedAt: { type: [string, 'null'], format: date-time }

  /courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: Every course under the tenant.
      responses:
        '200':
          description: The courses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { type: string }
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        titleEn: { type: [string, 'null'] }
                        term: { type: [string, 'null'] }
                        lectures: { type: integer, description: 'how many, not which' }
                        lastModified: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/unauthenticated' }
    post:
      tags: [courses]
      operationId: createCourse
      summary: Open a new course, and become its author.
      description: |
        For a lecturer starting a course of their own. Any `authors` session
        may call it; the caller is granted `author` on the new course in the
        same request, so it is in their next `GET /courses`. A signed-in
        session only — a token or a connector gets `403 session_required`,
        because a held credential must not be able to widen its owner's reach.

        The body is `course.json` without `lectures` and **without `id`**:
        `title` is the only required field. The id is generated — eight
        characters of lower-case Crockford base32 — and comes back in the
        answer; a body that carries `id` or `address` is `400 invalid_course`,
        so a script written before 2026-09-17 fails loudly instead of quietly
        getting an id it did not ask for. The published address is set later,
        once, with `PUT /courses/{c}/address`. Events `course.create` and
        `access.grant`.

        **`lang`** is the course's language — `he` or `en` — chosen here and
        fixed afterwards; `dir` is derived from it and written by the route
        whatever the body said, and a body whose `dir` contradicts its `lang`
        is a `400 invalid_course` at `/dir`. The studio's form always sends
        `lang`. A body without one opens the course as `he` and the answer
        carries a `warnings` array saying so, so a script written before
        2026-09-17 goes on working; that default is for one more batch.

        **Capped**: a user may open `courseLimit` courses (ten unless an
        administrator raised it on their access record), counted by the
        record's `opened` list. Over it is `403 course_limit` with `opened`
        and `limit` in the body. Administrators are not counted.

        **`from`** opens the course on a copy of a course template instead of
        empty. There are two, `starter-he` and `starter-en` — the tour of the
        studio every new author is given, written once per language rather
        than translated: every lecture, guide, demo and figure under
        `templates/<from>/` is copied into the new course, and `course.json`
        is written from this request — the title yours, the lecturer line the
        caller, the language the template's. An unknown name is `400
        invalid_template` and nothing is written; a template the store does
        not hold is `502 template_unavailable`, likewise with nothing left
        behind. A `lang` that disagrees with the template's is `400
        invalid_course`: copying the Hebrew tour into a course declared
        English is two lectures of Hebrew prose on a left-to-right page. A
        course opened this way is an ordinary course: it counts against the
        ceiling, it has no reader password yet, and the author may delete every
        lecture in it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                titleEn: { type: [string, 'null'] }
                term: { type: [string, 'null'] }
                lecturer: { type: [string, 'null'] }
                lang: { type: string }
                dir: { type: string, enum: [rtl, ltr] }
                theme: { $ref: '#/components/schemas/Theme' }
                platform: { type: string }
                from:
                  type: string
                  enum: [starter-he, starter-en]
                  description: >-
                    open the course on a copy of this course template; it
                    decides the course's language unless `lang` says the same
      responses:
        '201':
          description: Created, and granted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { $ref: '#/components/schemas/Course' }
                  etag: { type: string }
                  versionId: { type: string }
                  role:
                    type: string
                    enum: [author, admin]
                    description: what the caller now is on the course
                  warnings:
                    type: array
                    items: { type: string }
                    description: >-
                      present only when something was assumed — today, a body
                      with no `lang`, opened as `he`
                  from:
                    type: string
                    description: the template the course was opened on, when it was
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '502':
          description: |
            `template_unavailable` — the named template is not in the store, or
            it holds something that belongs to a course and not to a template.
            Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: getCourse
      summary: The course, its lectures with their state, and the guides present.
      description: |
        One request for the whole course page: `course.json`, a summary row
        per lecture (when it was last touched and by whom, whether it is
        published, how many author notes are open, whether it has a deck), and
        the names of the guides in the store.
      responses:
        '200':
          description: The course.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { $ref: '#/components/schemas/Course' }
                  etag: { type: string }
                  lectures:
                    type: array
                    items: { $ref: '#/components/schemas/LectureSummary' }
                  reader:
                    type: object
                    description: |
                      Whether this course has a reader password, and nothing
                      more — the password itself is `GET …/reader-password`,
                      which a `viewer` is refused.
                    properties:
                      set: { type: [string, 'null'], format: date-time }
                  guides:
                    type: array
                    items: { $ref: '#/components/schemas/GuideEntry' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [courses]
      operationId: putCourse
      summary: Write `course.json`.
      description: |
        Validated against `course.schema.json`; an unknown key is a `400`
        naming its JSON Pointer. `id` is overwritten with the one in the path.
        Event `course.save`.

        **`lang` is fixed.** It was chosen when the course was opened; a body
        that repeats the stored value (a `studio pull` then `push` round-trips
        the whole document) is fine, one that differs is `400 invalid_course`.
        `dir` is derived from it and written whatever the body said, as
        `POST /courses` does.

        **A course that does not exist** is created here only by an
        **administrator's session**, under the id in the path — `studio import`
        keeping the repo's own folder names. A token or a connector gets `403
        session_required` on that branch, the same answer `POST /courses`
        gives it: a held credential must not open courses. A non-administrator
        gets `403 admin_required`; they open their own with `POST /courses`.
        The create writes `dir` and logs `course.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Course' }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { $ref: '#/components/schemas/Course' }
                  etag: { type: string }
                  versionId: { type: string }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
    delete:
      tags: [courses]
      operationId: deleteCourse
      summary: Delete the course, whole. Administrators only, with the title repeated.
      description: |
        Removes every object under the course — lectures, figures, demos,
        notes, theme — the course's address claim, and the course's place in
        every access record, which frees the opener's slot under the cap. The
        versioned bucket is the only undo. The published copy on the site is
        not touched, so the address is free but the pages at it stay until
        something is published over them. Event `course.delete`.
      parameters:
        - name: confirm
          in: query
          required: true
          description: >-
            The course **title** again (it was the id until 2026-09-17, when
            the id stopped being something a person chose). Anything else is
            `400 confirm_required`.
          schema: { type: string }
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/guides:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: listGuides
      summary: The course's working documents that exist, and the four names there can be.
      description: |
        `conventions`, `glossary`, `syllabus`, `style`. Read these before
        writing a line of the course: they carry the notation, the sign
        conventions, the one Hebrew term per concept and the house style.
      responses:
        '200':
          description: The guides.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { type: string }
                  names:
                    type: array
                    items: { type: string, enum: [conventions, glossary, syllabus, style] }
                  guides:
                    type: array
                    items: { $ref: '#/components/schemas/GuideEntry' }

  /courses/{c}/guides/{name}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/guideName'
    get:
      tags: [courses]
      operationId: getGuide
      summary: One guide, as markdown.
      responses:
        '200':
          description: The document.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            text/markdown:
              schema: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [courses]
      operationId: putGuide
      summary: Write one guide.
      description: |
        `If-Match` is optional — a first push has no ETag to send — and means
        what it means everywhere else when it is present. At most 256 KB.
        Event `guide.save`.
      parameters:
        - $ref: '#/components/parameters/ifMatchOptional'
      requestBody:
        required: true
        content:
          text/markdown:
            schema: { type: string }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  etag: { type: string }
                  versionId: { type: string }
                  bytes: { type: integer }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '412': { $ref: '#/components/responses/precondition' }
        '413': { $ref: '#/components/responses/tooLarge' }

  /courses/{c}/weeks:
    parameters:
      - $ref: '#/components/parameters/course'
    put:
      tags: [courses]
      operationId: putCourseWeeks
      summary: The weeks the course declares.
      description: |
        A week exists because the lecturer declared it, not only because
        something carries its number: that is what lets a term be planned
        before it holds anything, and what gives a heading a name. The whole
        list is written at once and **sorted by `n`**, so the stored order is
        never a question.

        A week is a **heading, not a container** — nothing here names an item,
        and an item's `week` stays on its own manifest. Removing a week whose
        number a lecture or an exercise still carries is `409 week_in_use`,
        naming them: moving the content is the lecturer's act and not a side
        effect of deleting a heading. A declared week that nothing carries
        removes cleanly.

        `If-Match` is the course document's ETag and is optional; a stale one
        is a `412` carrying who wrote last. Event `weeks.save`, whose summary
        names the change (`week 5 added`, `week 3 titled`, `week 2 removed`).
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weeks]
              properties:
                weeks:
                  type: array
                  items: { $ref: '#/components/schemas/CourseWeek' }
      responses:
        '200':
          description: Saved, sorted by `n`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { type: string }
                  weeks:
                    type: array
                    items: { $ref: '#/components/schemas/CourseWeek' }
                  etag: { type: string }
                  versionId: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: >-
            `week_in_use` — a week being removed still holds lectures or
            exercises, listed in `items`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/precondition' }

  /courses/{c}/theme:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: getTheme
      summary: The course's theme, and everything the theme panel draws.
      description: |
        The stored theme, its resolved tokens, the generated CSS, the four
        gallery presets, the twelve token roles, the vendored faces and the
        colour-vision verdict — one screen, one request.
      responses:
        '200':
          description: The theme.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeResponse' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [courses]
      operationId: putTheme
      summary: Save the theme and regenerate `theme.css`.
      description: |
        Strict: an unknown preset, a token that is not one of the twelve, a
        colour that is not `#RRGGBB`, a face that is not vendored or a weight
        that face does not ship is a `400` (`invalid_preset`, `invalid_token`,
        `invalid_colour`, `invalid_font`, `invalid_weight`). A failing
        colour-vision verdict is **not** a refusal: it comes back in the body.
        Event `theme.save`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Theme' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeResponse' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/theme.css:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: getCourseThemeCss
      summary: The generated `theme.css` for the course.
      description: |
        What the shell's relative `<link>` resolves to for a page at course
        level. A course still on the base theme has no stored CSS and answers
        `404` rather than an empty stylesheet.
      responses:
        '200': { $ref: '#/components/responses/css' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/address:
    parameters:
      - $ref: '#/components/parameters/course'
    put:
      tags: [courses]
      operationId: putCourseAddress
      summary: Set the course's published address, once, before the first publish.
      description: |
        The address is the first segment of every published URL, the key the
        edge looks a course up by, and the reader user name. It was the course
        id until 2026-09-17; the id is generated now and means nothing to a
        student, so the address is a field of its own, chosen in the publishing
        panel at the moment it matters — before the first publish.

        **Unique across the tenant**, and refused with `409 address_taken`
        otherwise (the race included: the claim object is written with
        `If-None-Match: *`). The platform's own names are refused with `400
        reserved_address`: `api`, `lib`, `studio`, `demos`, `index.html`,
        `robots.txt`, `templates`, `site`. Anything that is not a path segment
        is `400 invalid_address`.

        **Fixed after the first publish.** Once `course.publishedFirst` is set
        — stamped by the publish route — this is `409 address_fixed`: students,
        a syllabus and a bookmark hold the old one. Setting the address it
        already has is a `200` that writes nothing.

        An author of the course, **from a session**: a token or a connector
        gets `403 session_required`, the rule the reader password has, for the
        same reason. Event `course.address`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$' }
      responses:
        '200':
          description: Set, or already this.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { type: string }
                  address: { type: string }
                  fixed: { type: boolean, description: whether the course has published and the address is now immutable }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: |
            `address_taken` — another course in the tenant is published there;
            `address_fixed` — this course has published and the address stays;
            `course_changed` — `course.json` was written by somebody else.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/reader-password:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: getReaderPassword
      summary: The course's reader password, in clear, for an author of the course.
      description: |
        The one credential a student types to open this course's published
        notes. The user name is **the course's address**, fixed, so a class is
        told two things and neither has to be explained twice.

        It is stored in clear on purpose: the edge holds only a digest, and the
        lecturer at the podium being asked "what was the password" is the real
        case. A class credential is a secret from the log, not from its owner —
        it appears in no event, no log line and no URL. **An author of the
        course only**: an administrator too, a `viewer` gets `403
        course_read_only`, and a token or a connector gets `403
        session_required`.
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReaderPassword' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404':
          description: No reader password is set for this course.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [courses]
      operationId: putReaderPassword
      summary: Set the course's reader password. Its author, from a session.
      description: |
        Writes the digest the edge compares against and the record above, in
        that order — a record that says a password is set while the edge still
        refuses everybody would be a lie the studio then repeats. The write
        lands at the edge in seconds and nothing is deployed.

        **8 to 64 characters, printable ASCII, no colon.** Printable ASCII
        because HTTP Basic Auth has no encoding browsers agree on for anything
        else; no colon because Basic Auth joins the user name and the password
        with one. Anything else is `400 invalid_password` saying which rule.

        **The course needs an address first** — `409 address_required`, because
        the digest is keyed by it and a password set against nothing would be a
        password for no door. `PUT /courses/{c}/address` is the step before
        this one, and the publishing panel asks in that order.

        **A session only.** A token or a connector gets `403 session_required`:
        a held credential must not be able to change the door students walk
        through. Event `reader.set`, carrying not one character of it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: string, description: the course's address }
                  set: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: '`address_required` — the course has no address yet.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: |
            The edge's credential store refused the write, so nothing was
            written here either — `reader_store_unavailable`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [courses]
      operationId: deleteReaderPassword
      summary: Clear it. The published course is a 404 at the edge again.
      description: |
        Removes the digest and then the record. Publishing is refused with
        `409 reader_password_required` until a new one is set. Event
        `reader.clear`.
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: string }
                  set: { type: ['null'] }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '502':
          description: The edge's credential store refused the delete; nothing was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/lectures/{l}/theme.css:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    get:
      tags: [courses]
      operationId: getLectureThemeCss
      summary: The same stylesheet, one level deeper.
      description: |
        The preview route lives under the lecture and the shell links
        `theme.css` relatively, so both levels resolve to the one stored copy.
        Publish is what makes the real siblings on the site.
      responses:
        '200': { $ref: '#/components/responses/css' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures:
    parameters:
      - $ref: '#/components/parameters/course'
    post:
      tags: [lectures]
      operationId: createLecture
      summary: Start a lecture — a title, and the server invents the rest.
      description: |
        `{ title, week? }` → `201 { manifest, etag }`, added 2026-09-24 so a
        lecture can be started from the browser under the week it belongs to.

        **The id is generated** — eight characters of lower-cased Crockford
        base32, as an exercise's and a course's are — and a body carrying `id`
        is `400 invalid_manifest`; so is one carrying any field but `title` and
        `week`. A caller that already holds a manifest and an id of its own
        wants `PUT /courses/{c}/lectures/{l}`, which writes the whole lecture.

        `number` is the largest any lecture of the course carries plus one (1
        for a course with none), and the author changes it in the settings
        drawer. `docTitle` is composed from the number, the title and the
        course's own title. `notes.html` starts as a `header.notes-head`
        holding the title as its `h1` and nothing after it — no section and no
        placeholder paragraph.

        The fragment is written first and the id is appended to
        `course.lectures` last, under `If-Match` on the course document, so a
        failure can never leave the course listing a lecture whose prefix is
        empty. Event `lecture.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, description: "the lecture's title, in the course's language" }
                week: { type: [integer, 'null'], minimum: 1, maximum: 52 }
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest: { $ref: '#/components/schemas/Lecture' }
                  etag: { type: string, description: "the manifest's" }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures/{l}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    get:
      tags: [lectures]
      operationId: getLecture
      summary: The manifest, both fragments with their ETags, and the live lock.
      description: |
        The start of every edit loop. Keep the ETags: `PUT …/notes` requires
        the one that came back here.
      responses:
        '200':
          description: The lecture.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course:
                    type: object
                    description: >-
                      the course's identity and language, so a client that
                      renders the lecture knows which direction it reads and
                      which words the platform puts in it
                    properties:
                      id: { type: string }
                      lang: { type: string, enum: [he, en] }
                      dir: { type: string, enum: [rtl, ltr] }
                  manifest: { $ref: '#/components/schemas/Lecture' }
                  manifestEtag: { type: [string, 'null'] }
                  notes: { $ref: '#/components/schemas/StoredDocument' }
                  slides: { $ref: '#/components/schemas/StoredDocument' }
                  lock: { $ref: '#/components/schemas/Lock' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [lectures]
      operationId: putLecture
      summary: Create or replace a whole lecture. No ETags.
      description: |
        `studio import`: the manifest, the notes fragment and optionally the
        deck fragment in one write, appended to `course.json`'s lecture order
        if it is new. This is the route for a caller that already **has** a
        lecture and an id for it; `POST /courses/{c}/lectures` is the other
        one, for a caller that has only a title and wants the server to invent
        the id, the number and an empty document. Event `import`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                manifest: { $ref: '#/components/schemas/Lecture' }
                notes: { type: string, description: 'the notes fragment' }
                slides: { type: string, description: 'the deck fragment' }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest: { $ref: '#/components/schemas/Lecture' }
                  manifestEtag: { type: string }
                  notes: { $ref: '#/components/schemas/SaveResult' }
                  slides: { $ref: '#/components/schemas/SaveResult' }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '422': { $ref: '#/components/responses/unsafeMarkup' }
    delete:
      tags: [lectures]
      operationId: deleteLecture
      summary: Delete the lecture, and the published page with it.
      description: |
        **One verb that leaves nothing behind.** The draft prefix goes — the
        manifest, both fragments, the figures, the data, the notes thread, the
        publish jobs and the lock; the id leaves `course.lectures` under
        `If-Match`; and if the lecture had been published, every object under
        its site prefix goes too, both front pages are rewritten without it and
        the CDN is purged for its paths and for both index pages. There is no
        separate *unpublish*, which is why this reconciles the site itself.
        Event `lecture.delete`.

        Nothing is recoverable through the studio. The content bucket is
        versioned and noncurrent versions live for a year, so a delete can be
        undone by us and by nobody else; the site bucket is not versioned and
        does not need to be, since publishing the restored lecture puts its
        pages back.
      parameters:
        - name: confirm
          in: query
          required: true
          description: >-
            The lecture **title** again, trimmed and compared to nothing else.
            A manifest with no title takes the lecture's id, which — unlike a
            course's — is the folder name a person chose. Anything else is
            `400 confirm_required`, whose body carries the string that was
            wanted as `confirm`.
          schema: { type: string }
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures/{l}/notes:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/ifMatch'
      - $ref: '#/components/parameters/ifNoneMatch'
      - $ref: '#/components/parameters/changedBlocks'
      - $ref: '#/components/parameters/studioClient'
    put:
      tags: [lectures]
      operationId: putNotes
      summary: Save the whole notes fragment.
      description: |
        The body is the **whole fragment**, not a patch. The server normalises
        it through the schema — which is the sanitiser — assigns `data-id` to
        blocks that have none, and writes conditionally.

        `If-Match` is **required**, with the ETag from `GET …/lectures/{l}`;
        `If-None-Match: *` creates a document that does not exist yet. Without
        either it is a `400 if_match_required`. On a lost race it is a `412`
        carrying the current ETag and who saved it, which is where the
        three-way merge starts.

        `x-changed-blocks` is the list of block ids you changed; it becomes the
        event summary and is otherwise ignored.

        An **empty body** is `400 empty_body`, nothing written: a save carries
        the whole document, and an empty one would wipe the lecture.

        A fragment carrying markup the schema would not emit — a `<script>`,
        an `on*` attribute on **any** element, a `javascript:` link — is `422
        unsafe_markup` naming the blocks, nothing written. A `data-id` that
        repeats an earlier block's is not refused: the second block is treated
        as new and gets its own id, counted in `idsAssigned`. The first keeps
        the id, because that is the one the notes and the history point at.
      requestBody:
        required: true
        content:
          text/html:
            schema: { type: string }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResult' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/unsafeMarkup' }

  /courses/{c}/lectures/{l}/slides:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/ifMatch'
      - $ref: '#/components/parameters/ifNoneMatch'
      - $ref: '#/components/parameters/changedBlocks'
      - $ref: '#/components/parameters/studioClient'
    put:
      tags: [lectures]
      operationId: putSlides
      summary: The same, for the deck.
      description: |
        Identical rules to `PUT …/notes`. A deck a lecture does not have yet is
        created with `If-None-Match: *`.
      requestBody:
        required: true
        content:
          text/html:
            schema: { type: string }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResult' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/unsafeMarkup' }

  /courses/{c}/lectures/{l}/manifest:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/ifMatchOptional'
    put:
      tags: [lectures]
      operationId: putManifest
      summary: Write `lecture.json`.
      description: |
        Validated against `lecture.schema.json`. A key the document does not
        have, or a `demos` entry that is neither `{module, export, opts?}` nor
        `{kind: file, demo}`, is a `400` whose `path` is the JSON Pointer of the
        offending key. `published` is the publish route's: a body carrying it is
        a `400`, and the stored value is carried forward for you. `id` is
        overwritten with the one in the path. Event `manifest.save`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Lecture' }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest: { $ref: '#/components/schemas/Lecture' }
                  etag: { type: string }
                  versionId: { type: string }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '412': { $ref: '#/components/responses/precondition' }

  /courses/{c}/lectures/{l}/versions:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    get:
      tags: [lectures]
      operationId: listVersions
      summary: Every stored version of both documents, joined with the event that wrote it.
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items: { $ref: '#/components/schemas/Version' }
                  slides:
                    type: array
                    items: { $ref: '#/components/schemas/Version' }

  /courses/{c}/lectures/{l}/restore:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    post:
      tags: [lectures]
      operationId: restoreVersion
      summary: Copy an old version onto the current document.
      description: |
        A restore is a new version, not a rewind: the history it came from
        stays. Event `restore`. A `versionId` that is not one of this
        document's — unknown, malformed, or another document's — is `404
        not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, versionId]
              properties:
                key: { type: string, enum: [notes, slides] }
                versionId: { type: string }
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  etag: { type: string }
                  versionId: { type: string }
                  restoredFrom: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures/{l}/uploads:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    post:
      tags: [lectures]
      operationId: presignUpload
      summary: A presigned target for a figure or a data file.
      description: |
        Step one of two. Declare the name, the content type and the size; the
        answer is a URL and a set of form fields to POST the bytes to
        **directly** — the API never carries them. Then reference the file from
        the fragment as `href`, which is `figures/<name>` or `data/<name>`.

        PNG, SVG and JPEG go under `figures/`, JSON under `data/`, at most
        5 MB. The event `figure.upload` is written **here**, at the presign,
        because with S3 the bytes never touch the API and this is the last
        moment it knows anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, size]
              properties:
                name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$' }
                type:
                  type: string
                  enum: [image/png, image/svg+xml, image/jpeg, application/json]
                size: { type: integer }
                dir: { type: string, enum: [figures, data] }
      responses:
        '200':
          description: Where to post the bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignedPost' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/lectures/{l}/figures/{name}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/assetName'
    get:
      tags: [lectures]
      operationId: getFigure
      summary: A draft figure.
      description: |
        What the preview page resolves `figures/<name>` to. An SVG is
        sanitised on the way out exactly as publish sanitises it on the way in,
        so an author judges the figure they are about to publish; a clean file
        comes back byte for byte.
      responses:
        '200':
          description: The bytes.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string } }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [lectures]
      operationId: putFigure
      summary: Store a figure directly, bytes in the request.
      description: |
        The other way to put a figure beside a lecture. The two-step presign
        (`POST …/uploads`) is right for a browser, which should not send a
        megabyte through the API when it can post it to S3; it is wrong for an
        agent, which is already holding the bytes and cannot post a multipart
        form to a URL it was handed. Same allow-list, same 5 MB cap, same
        `figure.upload` event.

        The `Content-Type` is the declared type and is checked against the
        extension: PNG, SVG or JPEG here, `application/json` under `data/`.
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/svg+xml: { schema: { type: string } }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredAsset' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/lectures/{l}/data/{name}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - $ref: '#/components/parameters/assetName'
    get:
      tags: [lectures]
      operationId: getData
      summary: A draft data file — numbers computed ahead of time that a demo reads instead of computing them.
      responses:
        '200':
          description: The JSON.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [lectures]
      operationId: putData
      summary: Store a data file directly, bytes in the request.
      description: |
        `putFigure` for `application/json` under `data/`. Same cap, same event.
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredAsset' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/lectures/{l}/preview:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - name: mode
        in: query
        required: false
        description: |
          `notes` (default) and `slides` are whole pages, openable in a tab.
          `preview` is the notes body only, for a client that has already
          loaded the platform CSS and renders the reading view into its own
          page.
        schema: { type: string, enum: [notes, slides, preview], default: notes }
    get:
      tags: [lectures]
      operationId: getPreview
      summary: The shell around the draft.
      description: |
        The same renderer that publishes, so what you see here cannot drift
        from what a student gets. `Cache-Control: no-store`, because a cached
        preview of a draft is a lie.
      responses:
        '200':
          description: The page.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures/{l}/publish:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    post:
      tags: [publish]
      operationId: publishLecture
      summary: Render the draft onto the site and start the print job.
      description: |
        Copies an explicit list — the shelled `notes.html`, the shelled
        `slides.html` if there is one, `figures/*`, `data/*` and `theme.css` —
        into the site area, writes `manifest.published`, and answers `202` with
        a job id. Poll `GET …/publish/{job}` until it is `done` or `failed`.

        The copy has already happened when you get the `202`. What is still
        running is the PDF, and **a failed print is a failed job, not a failed
        publish**: the pages are live either way and the job record says so.

        **Two refusals before a single key is copied, in this order.** `409
        address_required` — the course has no published address yet, and every
        site key, the edge's lookup and the reader user name are that address.
        Then `409 reader_password_required` — the edge admits a course prefix
        only when its credential is in the store, so publishing without one
        would put a lecture on the CDN that every student gets a 404 for. Both
        are set in the publishing panel on the course page, in that order
        (`PUT /courses/{c}/address`, then `PUT /courses/{c}/reader-password`).

        Everything written to the site is under the **address**: `<address>/<lecture>/…`,
        the course-root `theme.css` and the front page's links. The first
        publish stamps `course.publishedFirst`, which fixes the address.

        **Two front pages are rewritten** (M28): the course's lecture list at
        `<address>/index.html`, behind the course's reader password, and the
        tenant's public landing at `/index.html` — one card per published
        course, with no lecture title on it — rebuilt from every course in the
        tenant so a second author's publish adds a card rather than replacing
        one. Both keys are in the job's `keys` list.

        Events `publish.start`, then `publish.done` or `publish.failed`.
      responses:
        '202':
          description: Accepted; the pages are on the site and the print is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { type: string }
                  status: { type: string, enum: [copying, rendering, done, failed] }
                  site: { type: string }
                  keys: { type: array, items: { type: string } }
                  published: { $ref: '#/components/schemas/Published' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: |
            `address_required` — the course has no published address; then
            `reader_password_required` — it has no reader password. Nothing was
            copied either way. `course` names it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/lectures/{l}/publish/{job}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - name: job
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Z0-9]{4,40}$' }
    get:
      tags: [publish]
      operationId: getPublishJob
      summary: The job, while it runs and after it stops.
      description: '`copying` → `rendering` → `done` | `failed`.'
      responses:
        '200':
          description: The job record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/lectures/{l}/notes-thread:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    get:
      tags: [threads]
      operationId: getNotesThread
      summary: The author notes on this lecture.
      description: |
        Never published. This is where to leave a question instead of guessing
        at the subject: anchor it to the block you are unsure about and say
        what you would do.
      responses:
        '200':
          description: The thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
    post:
      tags: [threads]
      operationId: addNote
      summary: Add a note.
      description: 'Event `note.add`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                anchor: { $ref: '#/components/schemas/Anchor' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/busy' }

  /courses/{c}/lectures/{l}/notes-thread/{id}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [threads]
      operationId: patchNote
      summary: Reply, resolve, reopen, or edit your own note.
      description: |
        One of `reply`, `status` or `body` per call. Editing `body` is the
        note's author's alone. Events `note.reply`, `note.resolve`,
        `note.reopen`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reply: { type: string }
                status: { type: string, enum: [open, done] }
                body: { type: string }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/busy' }
    delete:
      tags: [threads]
      operationId: deleteNote
      summary: Remove a note and its replies. The note's author only.
      description: 'Event `note.delete`.'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/busy' }

  /courses/{c}/lectures/{l}/lock:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/lecture'
    post:
      tags: [lectures]
      operationId: acquireLock
      summary: Take or refresh the soft lock.
      description: |
        Not a mutex — a courtesy. Holding it gives you nothing; saving is still
        governed by `If-Match`. What it buys is a banner before someone starts
        typing rather than a conflict after. Five minutes, refreshed by an open
        editor every sixty seconds. Only taking it writes an event
        (`lock.acquire`).
      responses:
        '200':
          description: Held.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lock: { $ref: '#/components/schemas/Lock' }
                  refreshed: { type: boolean }
        '403': { $ref: '#/components/responses/forbidden' }
        '409':
          description: Someone else has it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [lectures]
      operationId: releaseLock
      summary: Release the lock. The holder's only.
      description: 'Event `lock.release`.'
      responses:
        '204':
          description: Released, or there was nothing to release.
        '403': { $ref: '#/components/responses/forbidden' }

  /events:
    get:
      tags: [session]
      operationId: listEvents
      summary: The activity feed, newest first, capped at 200.
      description: |
        One record per mutation, append-only. Every route that changes anything
        writes one before it answers, so this is the honest record of what
        happened and who did it.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: strictly newer than this instant
        - name: course
          in: query
          schema: { type: string }
        - name: lecture
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 200, default: 200 }
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  count: { type: integer }

  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: The caller's own access tokens, never the hash.
      description: |
        A session only — a token asking is 403 `session_required`, so a leaked
        credential cannot enumerate its siblings. Each row carries a `state`
        (`active` · `expired` · `revoked`) computed at read time.
      responses:
        '200':
          description: The caller's tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/Token' }
        '403': { $ref: '#/components/responses/forbidden' }
    post:
      tags: [tokens]
      operationId: mintToken
      summary: Mint an access token. The secret is in this response and nowhere else.
      description: |
        Defaults: all three scopes, every course the owner can see, no expiry.
        `courses` must be `["*"]` or a subset of the owner's courses (400
        `unknown_course` otherwise). The groups are the minting session's,
        copied verbatim, so a token is never more than its owner was. Event
        `token.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 60 }
                scopes:
                  type: array
                  items: { type: string, enum: [read, write, publish] }
                courses:
                  type: array
                  items: { type: string }
                expires: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Minted. `secret` is shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: '#/components/schemas/Token' }
                  secret: { type: string, description: '`cst_<ulid>_<secret>`; store it, it is not retrievable' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }

  /tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke one of the caller's own tokens.
      description: |
        Someone else's is a 404, not a 403 — the id space is not enumerable.
        Conditional on the record's ETag with one retry; a third writer is 409
        `token_busy`. Event `token.revoke`. Takes effect within the authorizer's
        cache window (60 s deployed).
      responses:
        '200':
          description: 'Revoked (or already was — `alreadyRevoked: true`).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: '#/components/schemas/Token' }
                  alreadyRevoked: { type: boolean }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: Two writers raced twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /access:
    get:
      tags: [access]
      operationId: listAccess
      summary: Every access record. Administrators, sessions only.
      responses:
        '200':
          description: The records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRecord' }
        '403': { $ref: '#/components/responses/forbidden' }

  /access/{email}:
    parameters:
      - name: email
        in: path
        required: true
        description: Lower-cased on the way in; two spellings are one record.
        schema: { type: string, format: email }
    get:
      tags: [access]
      operationId: getAccess
      summary: One user's record.
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRecord' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [access]
      operationId: putAccess
      summary: Replace the user's roles map. Creates the record.
      description: |
        The whole map, deliberately: the record says what the last administrator
        decided. Read-modify-write server side with three retries. Event
        `access.grant`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: object
                  additionalProperties: { type: string, enum: [author, viewer] }
                courseLimit:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 1000
                  description: |
                    How many courses this user may open with `POST /courses`;
                    `null` returns them to the default (ten). Absent leaves
                    it alone. `opened` is not writable here.
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRecord' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
    delete:
      tags: [access]
      operationId: deleteAccess
      summary: Remove the record — the user sees no course afterwards.
      description: 'Event `access.revoke`.'
      responses:
        '204':
          description: Removed.
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/exercises:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [exercises]
      operationId: listExercises
      summary: The course's exercises, in the lecturer's order.
      description: |
        Every `exercise.json` named by `course.exercises`, in that order. An id
        whose manifest is missing comes back as `{ id, missing: true }` rather
        than being dropped, because a course listing an exercise that is not
        there is something to see and not something to hide.
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { type: string }
                  exercises:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
    post:
      tags: [exercises]
      operationId: createExercise
      summary: Open an exercise.
      description: |
        `{ title, week?, release? }`. **The id is generated** — eight
        characters of lower-cased Crockford base32, as a course id is — and a
        body carrying `id` is a `400 invalid_exercise`; so is one carrying
        `grades`, `created` or `by`, which are the server's.

        Writes three objects and appends the id to `course.exercises`: an
        empty `questions.html` and `key.html` holding the title as their `h1`,
        then the manifest. The fragments first, so a course can never list an
        exercise whose prefix is empty. Event `exercise.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                week: { type: [integer, 'null'], minimum: 1, maximum: 52 }
                release: { $ref: '#/components/schemas/ExerciseRelease' }
      responses:
        '201':
          description: Opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exercise: { $ref: '#/components/schemas/Exercise' }
                  etag: { type: string }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/exercises/{x}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/ifMatchOptional'
    get:
      tags: [exercises]
      operationId: getExercise
      summary: One exercise's manifest.
      description: |
        The manifest, its ETag, and the course's id, language and direction —
        the three fields the page needs to draw the fragment in the course's
        own language without a second request, exactly as `GET
        …/lectures/{l}` carries them.
      responses:
        '200':
          description: The manifest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course:
                    type: object
                    properties:
                      id: { type: string }
                      lang: { type: string, enum: [he, en] }
                      dir: { type: string, enum: [rtl, ltr] }
                  exercise: { $ref: '#/components/schemas/Exercise' }
                  etag: { type: string }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [exercises]
      operationId: putExercise
      summary: Title, week, dates and the points per question.
      description: |
        The whole manifest, validated against `exercise.schema.json`.
        `If-Match` is optional and honoured when sent.

        **Question ids are not writable.** They are the `data-id`s of the
        top-level sections of `questions.html` and are re-derived on every
        save of that fragment; a `questions` entry naming an id this exercise
        does not have is a `400 invalid_exercise` at `/questions`, and the
        stored order always wins — a body listing two of five questions is
        setting two prices, not reordering the exercise. A question priced
        `null` is allowed to be stored; it is what blocks *releasing* a grade
        (plan 04).

        `grades`, `created` and `by` are the server's: a body carrying one is
        a 400, and the stored value is carried forward when it is left out.
        Event `exercise.save`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Exercise' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exercise: { $ref: '#/components/schemas/Exercise' }
                  etag: { type: string }
                  versionId: { type: string }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '412': { $ref: '#/components/responses/precondition' }
    delete:
      tags: [exercises]
      operationId: deleteExercise
      summary: Remove the exercise — unless somebody has submitted.
      description: |
        Deletes the three objects and takes the id out of `course.exercises`.
        Nothing on the site to reconcile: no exercise key is ever copied there.

        **`409 exercise_has_submissions` while any student has submitted
        against it**: a submission is the only copy of a student's work, and an
        exercise deleted out from under one leaves a grade nobody can explain.
        The body carries `submitted` — how many students, which is the fact the
        author acts on. There is no `?force`. The course's **test student** is
        not one of them: their trial run is the author's own and is deleted
        with the exercise. Event `exercise.delete`.
      parameters:
        - name: confirm
          in: query
          required: true
          description: >-
            The exercise **title** again, the rule `DELETE /courses/{c}` has.
            Checked before the students' prefix is read, so an unconfirmed
            request never lists the class. `400 confirm_required` otherwise.
          schema: { type: string }
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: A student has submitted against this exercise.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/exercises/{x}/questions:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/ifMatch'
      - $ref: '#/components/parameters/ifNoneMatch'
      - $ref: '#/components/parameters/changedBlocks'
      - $ref: '#/components/parameters/studioClient'
    get:
      tags: [exercises]
      operationId: getExerciseQuestions
      summary: The questions fragment.
      description: |
        A notes fragment: a `header.notes-head` and a `main` of `section`s,
        **one section per question**.
      responses:
        '200':
          description: The fragment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [exercises]
      operationId: putExerciseQuestions
      summary: Save the whole questions fragment.
      description: |
        The same save as `PUT …/lectures/{l}/notes` — whole fragment,
        `If-Match` required, normalised through the schema, `422
        unsafe_markup` and `413 too_large` before anything is written — with
        one thing after it: **`questions[]` is re-derived from what was
        stored**. The top-level sections in order are the questions; a section
        that survived keeps its points, a new one is priced `null`, and an id
        whose section is gone is dropped. The new list comes back in the
        answer. Event `exercise.save`.
      requestBody:
        required: true
        content:
          text/html:
            schema: { type: string }
      responses:
        '200':
          description: Saved, with the re-derived question list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SaveResult'
                  - type: object
                    properties:
                      questions:
                        type: array
                        items: { $ref: '#/components/schemas/ExerciseQuestion' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/unsafeMarkup' }

  /courses/{c}/exercises/{x}/key:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/ifMatch'
      - $ref: '#/components/parameters/ifNoneMatch'
      - $ref: '#/components/parameters/changedBlocks'
      - $ref: '#/components/parameters/studioClient'
    get:
      tags: [exercises]
      operationId: getExerciseKey
      summary: The worked answers and the rubric. An author of the course, never a viewer.
      description: |
        A second fragment of the same shape, whose sections line up with the
        questions **by order**.

        **`403 course_read_only` for a `viewer`.** The course gate hands a
        viewer every other GET on the course; this is the marking scheme, and
        a `viewers` grant is what a teaching assistant or a colleague gets. It
        is never published, never served under `/courses/{c}/me/…`, and
        `cache-control: no-store`.
      responses:
        '200':
          description: The fragment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
    put:
      tags: [exercises]
      operationId: putExerciseKey
      summary: Save the whole key fragment.
      description: |
        As `PUT …/questions`, and it derives nothing: the key's sections carry
        no question ids and are aligned to the questions by order. Event
        `exercise.save`.
      requestBody:
        required: true
        content:
          text/html:
            schema: { type: string }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResult' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/unsafeMarkup' }

  /courses/{c}/exercises/{x}/preview:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
    get:
      tags: [exercises]
      operationId: previewExercise
      summary: The shell around one of the two fragments — a whole page, openable in a tab.
      description: |
        `?mode=questions` (the default) or `?mode=key`, rendered by the same
        shell the lecture preview uses, so what an author looks at and what a
        student would read are the same renderer. `?mode=key` is an author's,
        like the key route itself. `Cache-Control: no-store`.
      parameters:
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [questions, key], default: questions }
      responses:
        '200':
          description: A whole HTML page.
          content:
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/exercises/{x}/submissions:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
    get:
      tags: [grading]
      operationId: listSubmissions
      summary: One row per student on the roster, with the review's summary.
      description: |
        The grading list: every student on the roster, whether they have
        submitted, and what state their review is in — `drafts`, `accepted`,
        the questions that carry an accepted mark, and their total. So *the
        next unscored submission* is one call away, for a person or for a
        model, with no other state to hold.

        Sorted **submitted first, then by address**. The course's **test
        student** is one more row, last, with `test: true`, and only when it
        has a submission; it is outside `counts`, the release check, the
        gradebook and the CSV — everything that walks this list means the
        class.

        **An author of the course.** A `viewer` gets `403 course_read_only`: a
        class's handwriting, their marks and the roster's addresses beside them
        are not a thing a reader of the drafts is handed.
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  course: { type: string }
                  exercise: { type: object }
                  counts: { $ref: '#/components/schemas/GradingCounts' }
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/SubmissionRow' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/exercises/{x}/submissions/{sid}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/sid'
    get:
      tags: [grading]
      operationId: getSubmission
      summary: One submission and everything the grading screen draws.
      description: |
        **One call is one screen**: the student's typed answers as notes
        fragments, their pages as URLs this API serves, the review, and the
        exercise's questions with the key's sections **aligned by order**
        (the key carries no question ids of its own). A second round trip per
        question would be a page that fills in piece by piece while somebody is
        reading a derivation.

        The `sid` is a path parameter an author names, and it is checked
        against the course's roster — or the course's test student — before a
        key is composed: a `sid` that is on neither is a `404`.
      responses:
        '200':
          description: The submission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradingScreen' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/exercises/{x}/submissions/{sid}/pages/{q}/{n}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/sid'
      - $ref: '#/components/parameters/question'
      - name: n
        in: path
        required: true
        description: the page number within the question, as the submission indexes it
        schema: { type: integer, minimum: 1 }
    get:
      tags: [grading]
      operationId: getSubmissionPage
      summary: One photographed or scanned page, as bytes.
      description: |
        JPEG or PNG, `cache-control: no-store`. Through the API rather than as a
        presigned GET: a page is a few hundred kilobytes, and the roster check
        then happens on **every** page request rather than once, when a link was
        handed out.
      responses:
        '200':
          description: The image.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/exercises/{x}/submissions/{sid}/review:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/sid'
      - $ref: '#/components/parameters/ifMatchOptional'
    put:
      tags: [grading]
      operationId: putReview
      summary: Write items and scores. Upsert by item id.
      description: |
        `{ items?: [...], scores?: {...} }`. An item with an `id` that is
        already there is updated in place and keeps its `created`; one with no
        `id` is a new item with a ULID of its own. A score is a number, `null`
        to unmark, or `{ points }` — which is what `GET …/submissions/{sid}`
        hands back, so a client may send back what it was given.

        **The state is the route's and never the caller's.** Everything written
        by a request whose identity is an access token or the MCP connector is
        stored `state: 'draft'`, *whatever the body says*; a signed-in
        session's own write is `accepted`. There is no parameter that asks for
        `accepted`, and there must never be one: the lecturer's own Claude may
        write as much as it likes and nothing it writes is a grade until a
        person accepts it here or in the workspace.

        `If-Match` on `review.json` when the caller holds one; a `412` is the
        lecturer being told their own agent wrote while the page was open.
        Event `review.save`. When the exercise's grades are already released,
        `gradebook.json` is rebuilt by the same call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ReviewItem' }
                scores:
                  type: object
                  additionalProperties: true
                  description: '`{ "<question id>": number | null | { points } }`'
      responses:
        '200':
          description: The whole review, as stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  review: { $ref: '#/components/schemas/Review' }
                  etag: { type: string }
        '400': { $ref: '#/components/responses/invalidDocument' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '412': { $ref: '#/components/responses/precondition' }
        '409': { $ref: '#/components/responses/busy' }

  /courses/{c}/exercises/{x}/submissions/{sid}/review/items/{id}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/sid'
      - name: id
        in: path
        required: true
        description: the review item's id
        schema: { type: string }
    delete:
      tags: [grading]
      operationId: deleteReviewItem
      summary: Discard one item.
      description: |
        A mark is not discardable the same way: it is unset by writing `null`
        to it, which keeps who unset it and when. Event `review.save`.
      responses:
        '204': { description: Discarded. }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/exercises/{x}/submissions/{sid}/review/accept:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/sid'
    post:
      tags: [grading]
      operationId: acceptReview
      summary: Accept drafts — the moment a thing an agent wrote becomes a grade.
      description: |
        `{ items?: [ids] | "all", scores?: [qids] | "all" }`; an **empty body
        accepts everything**, which is what the button at the top of the page
        does. Its own action in the log (`review.accept`) because a disputed
        mark is argued over exactly this line.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                items: { description: 'item ids, or "all"' }
                scores: { description: 'question ids, or "all"' }
      responses:
        '200':
          description: The review, and how many drafts moved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  review: { $ref: '#/components/schemas/Review' }
                  etag: { type: string }
                  accepted: { type: integer }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/exercises/{x}/release:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
    post:
      tags: [grading]
      operationId: releaseGrades
      summary: Release the grades, and rebuild the gradebook.
      description: |
        Stamps `grades.released` on the exercise; from then on an accepted
        change is visible to students at once. **Refused with `409
        grades_not_ready`** while a question carries no points, or while a
        student on the roster has no accepted mark for a question that does —
        the body names them, so the studio can show the list — unless the body
        says `{ "force": true }`, in which case those students simply read *not
        graded*.

        The test student is not checked: it is the lecturer's own dry run.
        Event `exercise.release`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, description: release although somebody is unmarked }
      responses:
        '200':
          description: Released.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exercise: { $ref: '#/components/schemas/Exercise' }
                  etag: { type: string }
                  gradebook: { $ref: '#/components/schemas/Gradebook' }
                  forced: { type: boolean }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: '`grades_not_ready`, naming the students and the unpriced questions.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
                  students:
                    type: array
                    items:
                      type: object
                      properties:
                        sid: { type: string }
                        email: { type: [string, 'null'] }
                        missing: { type: array, items: { type: string } }
                  unpriced: { type: array, items: { type: string } }

  /courses/{c}/gradebook:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [grading]
      operationId: getGradebook
      summary: Students × released exercises, with the course totals.
      description: |
        Derived from every review of the course and rebuilt on the way out, so
        the grid a lecturer is looking at is true; the stored `gradebook.json`
        is written by the same call and is what a later export reads. The test
        student is not in it, and neither is an exercise whose grades have not
        been released. **An author of the course.**
      responses:
        '200':
          description: The gradebook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gradebook' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/gradebook.csv:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [grading]
      operationId: getGradebookCsv
      summary: The same, as CSV — email, sid, one column per released exercise, total.
      description: |
        UTF-8 **with a byte-order mark**, because Excel on Windows reads a
        UTF-8 file without one as the system code page and renders a Hebrew
        exercise title as mojibake. `content-disposition: attachment`.
      responses:
        '200':
          description: The CSV.
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/members:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: listMembers
      summary: Who has which role on this course. Authors and administrators.
      description: |
        The one read a `viewer` is refused (403): a lecturer may see who reads
        their drafts; a student may not enumerate the course.
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        email: { type: string }
                        role: { type: string, enum: [author, viewer] }
        '403': { $ref: '#/components/responses/forbidden' }

  /courses/{c}/roster:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [courses]
      operationId: getRoster
      summary: The course's students, with each one's sid. An author of the course.
      description: |
        The list a lecturer uploaded: one line per student, with the `sid` their
        work is filed under. **An author of the course** (an administrator too);
        a `viewer` gets `403 course_read_only`, because a reader of the drafts
        is not somebody to hand two hundred email addresses to.

        The access record beside each line is the gate; this is the course's own
        copy, and it is what the grading list and the gradebook read.
      responses:
        '200':
          description: The roster, sorted by address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roster' }
        '403': { $ref: '#/components/responses/forbidden' }
    put:
      tags: [courses]
      operationId: putRoster
      summary: Add addresses to the roster. Idempotent, and reports per address.
      description: |
        Each address becomes a user in the Cognito pool in the `students`
        group, a `student` role on this course, and a line here — in that
        order, because a grant on an address nobody can sign in as does
        nothing. A student signs in with their address and a one-time code;
        there is no password and no invitation email.

        **Idempotent, and one bad line does not cost the others.** A lecturer
        pastes a column out of a spreadsheet and half of it is last week's
        paste, so the answer is `{ added, present, refused }` rather than a
        400 on the first typo. `refused` carries a `reason` each:

        - `invalid_email` — not an address;
        - `has_role` — that address is already an `author` or a `viewer` of
          this course, and the roles map holds one role per course, so adding
          it would quietly revoke what they have. A lecturer who wants to see
          the student workspace adds a second address;
        - `identity_failed` — the pool refused; the log has the reason.

        At most 500 addresses per call (`400 too_many`). Event `roster.add`,
        one per address actually added, carrying the address and the `sid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails:
                  type: array
                  maxItems: 500
                  items: { type: string }
      responses:
        '200':
          description: What happened to each address.
          content:
            application/json:
              schema:
                type: object
                required: [course, added, present, refused]
                properties:
                  course: { type: string }
                  added: { type: integer, description: how many were new }
                  present: { type: integer, description: how many were already on the roster }
                  refused:
                    type: array
                    items:
                      type: object
                      properties:
                        email: { type: string }
                        reason: { type: string, enum: [invalid_email, has_role, identity_failed] }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '409':
          description: '`roster_busy` — the roster changed under three retries.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/roster/test:
    parameters:
      - $ref: '#/components/parameters/course'
    delete:
      tags: [courses]
      operationId: resetTestStudent
      summary: Reset the course's test student — the entry and everything under it.
      description: |
        Every course has one built-in **test student**: a `sid` under `test` in
        `roster.json`, with no Cognito user, no email and no access record. An
        author's own `/courses/{c}/me/**` resolves to it, so a lecturer can see
        the course as a student and submit an exercise to watch it land in
        grading without a second account. It is created lazily, the first time
        an author opens the workspace.

        This is the reset: the entry goes, and so does every object under
        `students/<that sid>/`, so the next open starts from nothing with a
        fresh id. **An author of the course**; nothing here touches Cognito.
        Event `roster.reset`.

        Registered before `/courses/{c}/roster/{email}` — `test` is not an
        address, and the router's first match wins.
      responses:
        '204': { description: Reset. }
        '403': { $ref: '#/components/responses/forbidden' }
        '404':
          description: This course has no test student yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/roster/{email}:
    parameters:
      - $ref: '#/components/parameters/course'
      - name: email
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [courses]
      operationId: removeFromRoster
      summary: Take one student off this course's roster.
      description: |
        Removes the `student` grant and the roster line. The **`sid` stays** on
        the access record — a term's submissions are filed under it — and the
        Cognito user is never deleted; they leave the `students` group only
        once they are on no roster in the tenant at all. Event `roster.remove`.
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/forbidden' }
        '404':
          description: That address is not on this course's roster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------------
  # The student workspace (plan 03, 2026-09-22). Everything under
  # `/courses/{c}/me/` and nothing else is what a `students` session may
  # reach; the gate resolves the student id from the caller's own access
  # record, or — for an author of the course — from the course's test
  # student, which is why no route here has a `{sid}` in it.
  # ------------------------------------------------------------------------

  /courses/{c}/me:
    parameters:
      - $ref: '#/components/parameters/course'
    get:
      tags: [workspace]
      operationId: getMyCourse
      summary: The student's landing for one course — its weeks, its lectures and its exercises.
      description: |
        What a signed-in student on this course's roster sees: the course's
        identity, and its weeks. Each week carries its **lectures** — with the
        published URL on the site when there is one, and no `url` at all when
        there is not — and its **exercises**, each with what it is worth, its
        dates and *this student's* state on it: `not_started`, `draft`,
        `submitted`, or `graded` with the released total.

        **An exercise whose `release.from` is in the future is absent**, not
        listed as locked: a sheet a student cannot open is a sheet whose title
        is none of their business yet.

        The one exception is the course's **test student** — an author's own
        `/me/`. It sees those exercises with `notYetOpen: true`, so a lecturer
        can read what the class cannot yet, and `testStudent: true` on the
        answer is what the workspace draws its banner on.

        Grouping is `byWeek` from `@studio/schema`, the same function the
        studio's course page and the published lecture list use.
      responses:
        '200':
          description: The landing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentLanding' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/me/exercises/{x}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
    get:
      tags: [workspace]
      operationId: getMyExercise
      summary: One exercise as the student sees it, with their own submission.
      description: |
        The manifest as a student may read it, `questions.html`, this student's
        `submission.json` and the text of each typed answer — and, **only once
        `grades.released` is set on the exercise**, the `accepted` items and
        scores of `review.json`.

        Three absences are the point, and each is absent from the JSON rather
        than hidden by the page:

        - **`key.html` is never here.** This file never reads that key.
        - **A `draft` review item or score is never here**, whatever the
          release state: a draft is a model's suggestion or an unfinished
          sentence, and `via` and `author` are dropped with it.
        - **Nothing of a review is here before release.**

        `404` before `release.from`, for the reason the landing omits it — a
        `403` would confirm there is something to wait for. The test student is
        served it, with `notYetOpen: true`.

        `etag` is what every write to this submission sends back as `If-Match`;
        `null` means nothing has been written yet and the first write should
        send `If-None-Match: *`.
      responses:
        '200':
          description: The exercise, the submission, and the released review if there is one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentExercise' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /courses/{c}/me/exercises/{x}/parts/{q}/answer:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/question'
      - $ref: '#/components/parameters/ifMatch'
      - $ref: '#/components/parameters/ifNoneMatch'
    put:
      tags: [workspace]
      operationId: putMyAnswer
      summary: The typed answer to one question, as a notes fragment.
      description: |
        The body is HTML in the notes vocabulary and is normalised through
        `@studio/schema` like every other document in this store, so what is
        saved is what the schema emits. An **empty body clears** the typed
        answer — which is a real thing a student does, unlike a lecture save,
        where an empty document would be the page wiped.

        `If-Match` is the ETag of `submission.json`, not of this fragment: one
        token for the whole submission is what lets the workspace explain a
        second tab. `If-None-Match: *` on the first write of all.

        Refused with `409 closed` after the due date unless the exercise's
        `release.late` is `accept`, in which case the write lands and the
        submission is flagged `late`. Event `submission.save`, whose summary
        says the question and the kind (`s2: typed · 2 pages`) and never a
        character of the answer.
      requestBody:
        required: true
        content:
          text/html:
            schema: { type: string }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  submission: { $ref: '#/components/schemas/Submission' }
                  etag: { type: string }
                  versionId: { type: [string, 'null'] }
                  bytes: { type: integer }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: '`closed` — past the due date, and the lecturer takes no late work.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/precondition' }
        '413': { $ref: '#/components/responses/tooLarge' }
        '422': { $ref: '#/components/responses/unsafeMarkup' }

  /courses/{c}/me/exercises/{x}/parts/{q}/pages:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/question'
      - $ref: '#/components/parameters/ifMatch'
      - $ref: '#/components/parameters/ifNoneMatch'
    post:
      tags: [workspace]
      operationId: presignMyPage
      summary: A presigned target for one photographed or scanned page.
      description: |
        The presign discipline of `POST …/lectures/{l}/uploads`, with the
        students' own allow-list: **JPEG and PNG, 10 MB**, and a key under
        `parts/{q}/pages/`. The browser downscales to 2000 px on the long edge
        and re-encodes as JPEG before it asks, so a phone photograph arrives at
        about half a megabyte.

        **The page's number and file name are the route's**, minted one past
        the highest the question currently holds; a client sends the type, the
        size and the measurements and does not choose where its bytes go. At
        most 20 pages a question (`409 too_many_pages`).

        The entry is written when the target is handed out, not when the bytes
        land — with S3 the bytes never touch the API, so the presign is the
        last moment it knows anything. Event `submission.save`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, size]
              properties:
                type: { type: string, enum: [image/jpeg, image/png] }
                size: { type: integer, description: the size of the downscaled file, in bytes }
                w: { type: [number, 'null'], description: pixel width after downscaling }
                h: { type: [number, 'null'], description: pixel height after downscaling }
      responses:
        '200':
          description: Where to post the bytes, and the entry that now records the page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { $ref: '#/components/schemas/SubmissionPage' }
                  url: { type: string }
                  fields: { type: object }
                  maxBytes: { type: integer }
                  contentType: { type: string }
                  submission: { $ref: '#/components/schemas/Submission' }
                  etag: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: '`too_many_pages`, or `closed` past the due date.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/precondition' }
    put:
      tags: [workspace]
      operationId: reorderMyPages
      summary: The pages of one question, in the order the student wants them.
      description: |
        The **array is the order** and `n` is each page's own identity and file
        stem, so *move up* and *move down* rewrite this list and move no bytes.
        The body must be exactly the numbers this question already has, once
        each: a reorder can neither add a page nor lose one
        (`400 invalid_order`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Reordered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  submission: { $ref: '#/components/schemas/Submission' }
                  etag: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: '`closed` — past the due date, and the lecturer takes no late work.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/precondition' }

  /courses/{c}/me/exercises/{x}/parts/{q}/pages/{n}:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/question'
      - $ref: '#/components/parameters/pageNumber'
    get:
      tags: [workspace]
      operationId: getMyPage
      summary: One page's bytes.
      description: |
        Through the API, like a draft figure and for the same reason: an
        `<img src>` cannot carry a bearer token, so the SPA fetches the bytes
        with one and hands the element an object URL. A presigned GET would put
        a URL that works with no session into a page, and a student's
        handwriting is not something to hand out on a link —
        `cache-control: private, no-cache` says the same thing to every proxy
        in between.
      responses:
        '200':
          description: The image.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
    delete:
      tags: [workspace]
      operationId: deleteMyPage
      summary: Remove one page — the entry and the bytes.
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      description: |
        The entry first and the bytes second, which is the opposite order to a
        write and for the same reason: an object nothing points at is litter,
        while a pointer to bytes that are gone is a broken image on the grading
        page. The number is never reused, so a cached thumbnail cannot come
        back as the next page. Event `submission.save`.
      responses:
        '204':
          description: Removed. The `ETag` header is the submission's new one.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: '`closed` — past the due date, and the lecturer takes no late work.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/precondition' }

  /courses/{c}/me/exercises/{x}/submit:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/exercise'
      - $ref: '#/components/parameters/ifMatch'
    post:
      tags: [workspace]
      operationId: submitMyExercise
      summary: Hand the exercise in.
      description: |
        Sets `state: submitted` and `submittedAt`, and computes `late` against
        the exercise's due date. **A second submit before the due date
        replaces the first** — the store keeps the version, so nothing is lost
        and the lecturer sees the latest. After the due date it is a
        `409 closed` unless `release.late` is `accept`, in which case it lands
        and `late` is set for good: a submission that was late once does not
        stop having been.

        `404` when there is nothing to submit yet. Event `submission.submit`,
        whose summary says how many questions were answered and never what was
        written.
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  submission: { $ref: '#/components/schemas/Submission' }
                  etag: { type: string }
        '400': { $ref: '#/components/responses/badRequest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: '`closed` — past the due date, and the lecturer takes no late work.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/precondition' }

  /courses/{c}/demos:
    get:
      summary: Every demo in the course, with the lectures that wire each one
      operationId: listDemos
      parameters: [{ $ref: '#/components/parameters/course' }]
      responses:
        '200':
          description: The course's demo library
          content:
            application/json:
              schema:
                type: object
                required: [course, demos]
                properties:
                  course: { type: string }
                  demos:
                    type: array
                    items: { $ref: '#/components/schemas/DemoListing' }

  /courses/{c}/demos/{slug}:
    get:
      summary: One demo's manifest, the ETags of its three files, and its usedIn
      operationId: getDemo
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The demo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoListing' }
        '404': { description: No such demo }
    put:
      summary: Create or update demo.json; the slug in the path wins
      operationId: putDemo
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
        - { $ref: '#/components/parameters/ifMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoManifest' }
      responses:
        '200': { description: Updated }
        '201': { description: Created }
        '400': { description: invalid_slug, title_required or invalid_aspect }
        '412': { description: The If-Match did not hold }
        '413': { description: too_large — demo.json is capped at 4 KB }
    delete:
      summary: Remove all three files, unless a lecture wires the demo
      operationId: deleteDemo
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200': { description: Deleted, with the keys that were removed }
        '404': { description: No such demo }
        '409':
          description: demo_in_use — the body carries `usedIn`, the lectures that wire it

  /courses/{c}/demos/{slug}/publish:
    post:
      tags: [publish, demos]
      operationId: publishDemo
      summary: Publish one demo — the file, its page, and the course index.
      description: |
        **A demo is published on purpose by its author, like a lecture**, and
        never as a side effect of a lecture publish (that one copies the file
        of a demo the lecture wires, under the lecture, and writes no page).

        Synchronous: there is no render Lambda, no job record and no PDF, so
        this answers `200` and not `202` and there is nothing to poll. It
        writes three keys and then rewrites the course's front page so the
        demo shows under its week:

        ```
        <address>/demos/<slug>/demo.html    the file, under the edge's demo CSP
        <address>/demos/<slug>/still.png    what prints
        <address>/d/<slug>/index.html       the page around it
        ```

        The page lives under `d/` and not `demos/` because the edge sandboxes
        every response under a folder named `demos`, and this page loads the
        platform bundle.

        The same two refusals as a lecture publish, in the same order: `409
        address_required`, then `409 reader_password_required`. A third,
        `409 demo_file_required`, is this route's own — a demo with no
        `demo.html` would get a page framing a 404.

        The first publish of anything in a course — a demo as much as a
        lecture — stamps `course.publishedFirst`, which fixes the address:
        a student holds `/<address>/d/<slug>/` from here on.

        Event `demo.publish`. There is **no MCP tool for it**: the MCP asks
        before publishing anything, and a demo publish is a click on the
        demo's page in the studio.
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                type: object
                required: [slug, url, keys, published]
                properties:
                  slug: { type: string }
                  url: { type: string, description: 'the demo page a student opens' }
                  keys: { type: array, items: { type: string } }
                  published: { $ref: '#/components/schemas/Published' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409':
          description: >-
            `address_required` — the course has no published address; then
            `reader_password_required`; then `demo_file_required` — the demo
            has no `demo.html` to publish.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /courses/{c}/demos/{slug}/demo.html:
    get:
      summary: The draft document, served with the demo CSP and no x-frame-options
      operationId: getDemoHtml
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The file
          headers:
            Content-Security-Policy:
              schema: { type: string }
              description: The demo CSP (`src/demoCsp.js`) — no origin except frame-ancestors
          content:
            text/html: { schema: { type: string } }
        '404': { description: No such demo, or no document uploaded yet }
    put:
      summary: Upload the document; a demo.json must exist first
      operationId: putDemoHtml
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
        - { $ref: '#/components/parameters/ifMatch' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      requestBody:
        required: true
        content:
          text/html: { schema: { type: string } }
      responses:
        '200': { description: Written }
        '400': { description: invalid_type or empty_body }
        '404': { description: No demo.json for this slug }
        '412': { description: The condition did not hold }
        '413': { description: too_large — 2 MB }

  /courses/{c}/demos/{slug}/still.png:
    get:
      summary: The draft still frame
      operationId: getDemoStill
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The file
          content:
            image/png: { schema: { type: string, format: binary } }
        '404': { description: No such demo, or no still uploaded yet }
    put:
      summary: Upload the still frame
      operationId: putDemoStill
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/slug' }
        - { $ref: '#/components/parameters/ifMatch' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
      responses:
        '200': { description: Written }
        '400': { description: invalid_type or invalid_png }
        '404': { description: No demo.json for this slug }
        '413': { description: too_large — 1 MB }

  /courses/{c}/lectures/{l}/demos/{slug}/demo.html:
    get:
      summary: The same document at a lecture-relative path, for the preview
      description: >-
        The preview page is shelled with relative asset paths, so
        `demos/<slug>/demo.html` in its boot resolves against the lecture's own
        route — exactly as `figures/` does. The bytes are the same object.
      operationId: getLectureDemoHtml
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/lecture' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The file, with the demo CSP
          content:
            text/html: { schema: { type: string } }
        '404': { description: No such demo }

  /courses/{c}/lectures/{l}/demos/{slug}/still.png:
    get:
      summary: The same still at a lecture-relative path
      operationId: getLectureDemoStill
      parameters:
        - { $ref: '#/components/parameters/course' }
        - { $ref: '#/components/parameters/lecture' }
        - { $ref: '#/components/parameters/slug' }
      responses:
        '200':
          description: The file
          content:
            image/png: { schema: { type: string, format: binary } }
        '404': { description: No such demo }

  /courses/{c}/demos/{slug}/demo.json:
    parameters:
      - $ref: '#/components/parameters/course'
      - $ref: '#/components/parameters/slug'
    get:
      tags: [demos]
      operationId: getDemoManifestFile
      summary: The raw demo.json, exactly as stored.
      description: |
        `GET /courses/{c}/demos/{slug}` dresses the manifest for the studio —
        ETags of the three files, `usedIn` — which is the wrong shape to write
        to disk. `studio demos pull` wants the three files the format defines,
        so the raw one is served beside `demo.html` and `still.png`.
      responses:
        '200':
          description: The manifest file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoManifest' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }

  /mcp:
    post:
      tags: [mcp]
      operationId: postMcp
      summary: The MCP server — one JSON-RPC request in, one JSON response out.
      security: []
      description: |
        **Streamable HTTP, stateless** (spec revision 2026-07-28, which dropped
        sessions and the server-initiated stream). There is no `Mcp-Session-Id`
        and there is nothing to keep between calls, which is what lets this be
        one Lambda behind a gateway that closes a connection at thirty seconds.

        This route authenticates **itself**, which is why `security` here is
        empty rather than the document's default: an HTTP API's authorizer
        cannot put a header on its own 401, and OAuth discovery begins with a
        401 carrying
        `WWW-Authenticate: Bearer resource_metadata="…/.well-known/oauth-protected-resource/api/mcp"`.
        Two credentials are accepted — a Cognito **access** token from the
        `studio-connector` app client, whose scopes `studio/read`,
        `studio/write` and `studio/publish` become this API's `read`, `write`
        and `publish`; and a `cst_…` studio access token, for a shell agent
        that would rather speak MCP than HTTP.

        Every tool is dispatched back through this API's own router with the
        verified identity, so the group rule, the scopes, the course grants,
        the ETag rules, the sanitiser and the event log apply to a tool call
        exactly as they apply to a request off the wire. Events carry
        `via: { connector }` and `client: mcp/<sdk version>`.

        A body of notifications alone is answered `202` with no body.
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          description: The revision the client speaks. Echoed back on the response.
          schema: { type: string }
        - name: Mcp-Method
          in: header
          required: false
          description: A hint naming the JSON-RPC method, for logs and rate limits.
          schema: { type: string }
        - name: Mcp-Name
          in: header
          required: false
          description: A hint naming the tool or resource, for logs and rate limits.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: One JSON-RPC 2.0 message, or an array of them.
              oneOf:
                - type: object
                - type: array
                  items: { type: object }
      responses:
        '200':
          description: The JSON-RPC response.
          headers:
            MCP-Protocol-Version:
              description: The revision the client declared, echoed.
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                  - type: array
                    items: { type: object }
        '202':
          description: Notifications only; nothing to answer.
        '400':
          description: The body was not JSON-RPC. A JSON-RPC error object, not this API's error shape.
          content:
            application/json:
              schema: { type: object }
        '401':
          description: |
            No credential, or one this pool will not vouch for. Carries
            `WWW-Authenticate: Bearer resource_metadata="…"`, which is where a
            connector starts its sign-in.
          headers:
            WWW-Authenticate:
              description: '`Bearer resource_metadata="<origin>/.well-known/oauth-protected-resource/api/mcp"`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/badRequest' }
    get:
      tags: [mcp]
      operationId: getMcp
      summary: 405 — this server is stateless and opens no stream.
      security: []
      responses:
        '405':
          description: '`Allow: POST, DELETE`. There is no server-initiated stream to subscribe to.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [mcp]
      operationId: deleteMcp
      summary: 204 — there is no session to end.
      security: []
      responses:
        '204':
          description: Nothing to do, and saying so is friendlier than a 404.

  /.well-known/oauth-protected-resource/api/mcp:
    servers:
      - url: /
        description: |
          The origin, not `/api`. RFC 9728 puts a resource's metadata at
          `/.well-known/oauth-protected-resource` plus the resource URL's own
          path, so this document lives beside the site and a CloudFront
          behaviour routes it to this API (`infra/lib/edge-stack.ts`).
    get:
      tags: [mcp]
      operationId: getProtectedResourceMetadata
      summary: Where to sign in for /api/mcp.
      security: []
      description: |
        RFC 9728 §2, and public by specification. `resource` is exactly the URL
        a connector calls and exactly the value it sends as the RFC 8707
        `resource` parameter on the authorize and token requests;
        `authorization_servers` is this origin, whose
        `/.well-known/oauth-authorization-server` the client reads next —
        the pool's endpoints with the PKCE line Cognito leaves out.
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                type: object
                required: [resource, authorization_servers, scopes_supported]
                properties:
                  resource: { type: string, format: uri }
                  authorization_servers:
                    type: array
                    items: { type: string, format: uri }
                  scopes_supported:
                    type: array
                    items: { type: string }
                  bearer_methods_supported:
                    type: array
                    items: { type: string, enum: [header] }
                  resource_documentation: { type: string, format: uri }

  /.well-known/oauth-authorization-server:
    servers:
      - url: /
    get:
      tags: [mcp]
      operationId: getAuthorizationServerMetadata
      summary: The authorization server's metadata, published by the resource.
      security: []
      description: |
        RFC 8414. Cognito supports PKCE and does not advertise it, and an MCP
        client must refuse an authorization server whose metadata omits
        `code_challenge_methods_supported` — so this API publishes the pool's
        endpoints itself, verbatim, plus that one line. `issuer` is this
        origin, the value `authorization_servers` names.
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema: { type: object }
  /.well-known/openid-configuration:
    servers:
      - url: /
    get:
      tags: [mcp]
      operationId: getOpenIdConfiguration
      summary: The same document under the OpenID discovery name.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema: { type: object }

components:

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Two kinds of credential reach this API, and every route takes either:

        - a **Cognito ID token**, which is what the studio SPA and
          `studio login` send. The actor is the `email` claim and the groups
          are `cognito:groups`.
        - a **studio access token**, minted in the studio and held by an agent,
          scoped to `read` / `write` / `publish` and optionally to one course.
          It is shown once, at mint, and only its hash is stored; the event log
          carries the token's id and label, never the secret.

        On the local dev server there is no token at all: the header
        `x-dev-user: you@example.com` is the actor, and `x-dev-groups: viewers`
        makes it a read-only session. The server binds to localhost.

  parameters:
    slug:
      name: slug
      in: path
      required: true
      description: The demo's id in the course, and the folder it lives in.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,39}$' }
    course:
      name: c
      in: path
      required: true
      description: the course id, a folder name
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$' }
    lecture:
      name: l
      in: path
      required: true
      description: the lecture id, a folder name such as `L02-damped-driven`
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$' }
    exercise:
      name: x
      in: path
      required: true
      description: the exercise id, generated when the exercise is opened
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$' }
    sid:
      name: sid
      in: path
      required: true
      description: |
        a student's generated id, eight characters of lower-cased Crockford
        base32. The one place a student id arrives from a request: the grading
        routes check it against the course's roster before composing a key, and
        a `sid` on no roster is a 404. No route under `/courses/{c}/me/` has one
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$' }
    question:
      name: q
      in: path
      required: true
      description: a question's id — the `data-id` of its section in `questions.html`
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$' }
    pageNumber:
      name: n
      in: path
      required: true
      description: |
        A page's number: its identity and its file stem, minted by the route
        and never reused. It is not the page's position — the `pages` array's
        order is that.
      schema: { type: integer, minimum: 1 }
    guideName:
      name: name
      in: path
      required: true
      schema: { type: string, enum: [conventions, glossary, syllabus, style] }
    assetName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$' }
    ifMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The ETag from the `GET`. Required on a document save unless
        `If-None-Match: *` is sent instead.
      schema: { type: string }
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: '`*` to create a document that does not exist yet.'
      schema: { type: string, enum: ['*'] }
    ifMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Optional here; honoured when sent.
      schema: { type: string }
    changedBlocks:
      name: x-changed-blocks
      in: header
      required: false
      description: |
        The ids of the blocks this save changed, comma-separated or as a JSON
        array. Becomes the event summary. `?changed=a,b,c` does the same.
      schema: { type: string }
    studioClient:
      name: x-studio-client
      in: header
      required: false
      description: Recorded on the event, so history can say what wrote a block.
      schema: { type: string }

  headers:
    ETag:
      description: The quoted sha-1 of the body. Send it back as `If-Match`.
      schema: { type: string }

  responses:
    unauthenticated:
      description: No session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    forbidden:
      description: |
        A `viewers` session tried to write, or an actor tried something that is
        someone else's (a lock, another author's note, another author's brief).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    notFound:
      description: No such thing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    badRequest:
      description: The request could not be acted on; `error` says which rule it broke.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    invalidDocument:
      description: |
        The document failed its JSON Schema. `path` is the JSON Pointer of the
        offending key and `errors` carries up to ten of them.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    precondition:
      description: |
        Someone saved since you read. `etag` is what the store holds now and
        `actor` and `ts` are who wrote it. Re-`GET`, re-apply your change,
        and save again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PreconditionError' }
    unsafeMarkup:
      description: |
        The fragment carries markup the schema would not emit — a `<script>`,
        an `on*` attribute on any element, a `javascript:` or `data:` link, a
        `style` that fetches — and **nothing was written**. `blocks` names
        each offending block by the id you can address and lists what was
        found; fix the working copy and save again.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [unsafe_markup] }
              message: { type: string }
              blocks:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    block: { type: string }
                    problems: { type: array, items: { type: string } }
    tooLarge:
      description: Over the cap for this kind of document.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    busy:
      description: |
        A concurrent write could not be reconciled in three attempts, or the
        document is in a state that refuses this change.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    css:
      description: The stylesheet.
      content:
        text/css:
          schema: { type: string }

  schemas:
    Roster:
      type: object
      required: [course, students]
      properties:
        course: { type: string }
        students:
          type: array
          items:
            type: object
            required: [email, sid]
            properties:
              email: { type: string }
              sid:
                type: string
                description: |
                  Eight characters of Crockford base32. Everything this student
                  writes is filed under it; **no key under `students/` carries
                  an email**. One person, one sid, across every course of the
                  tenant.
              added: { type: [string, 'null'], format: date-time }
              by: { type: [string, 'null'], description: who added them }
        test:
          type: [object, 'null']
          description: |
            The course's **test student** — an author's own workspace, created
            lazily the first time one is opened. No person, no email, and not
            in `students`, because everything that walks the roster means the
            class.
          properties:
            sid: { type: string }
            created: { type: [string, 'null'], format: date-time }
            by: { type: [string, 'null'] }
        updated: { type: [string, 'null'], format: date-time }

    SubmissionPage:
      type: object
      description: One uploaded page of a handwritten answer.
      required: [n, key]
      properties:
        n:
          type: integer
          minimum: 1
          description: |
            The page's own number — its identity and its file stem, minted by
            the route and never reused. **Not its position**: the order of the
            `pages` array is that.
        key: { type: string, description: the store key the bytes are under }
        w: { type: [number, 'null'], description: pixel width after the browser downscaled it }
        h: { type: [number, 'null'], description: pixel height after the browser downscaled it }
        bytes: { type: [number, 'null'] }

    Submission:
      type: object
      description: |
        `submission.json` — one student's answer to one exercise. The typed
        answers and the page images are their own objects; this is the index
        over them, and the one object every write here is `If-Match` on.
      required: [exercise, student]
      properties:
        exercise: { type: string }
        student:
          type: string
          description: |
            The student's generated `sid`, resolved by the gate from the
            caller's own access record — never from a request parameter, and
            never an email.
        state: { type: string, enum: [draft, submitted] }
        submittedAt: { type: [string, 'null'], format: date-time }
        late:
          type: boolean
          description: |
            Taken after the due date under `release.late: accept`. Set for
            good: a submission that was late once does not stop having been.
        parts:
          type: object
          description: One entry per question that has anything in it, keyed by the question id.
          additionalProperties:
            type: object
            properties:
              typed: { type: boolean, description: is there a `parts/<q>/answer.html` with something in it }
              pages:
                type: array
                items: { $ref: '#/components/schemas/SubmissionPage' }
        updated: { type: [string, 'null'], format: date-time }

    StudentReview:
      type: object
      description: |
        The half of `review.json` a student is served: **accepted items and
        accepted scores, and only once `grades.released` is set**. A `draft`
        item or score is absent from the JSON, not hidden by the page, and
        `author` and `via` are dropped — who suggested a comment, and through
        which door, is the course's audit trail and not the student's business.
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: [string, 'null'] }
              question: { type: [string, 'null'] }
              target:
                type: [object, 'null']
                description: '`text` (a block id and a quote), `page` (a page and a rectangle), or `question`.'
              body: { type: string }
              points: { type: [number, 'null'], description: a delta the lecturer may have used or ignored }
        scores:
          type: object
          description: The number that counts, per question.
          additionalProperties:
            type: object
            properties:
              points: { type: [number, 'null'] }
        total: { type: [number, 'null'], description: the sum of the accepted scores }

    StudentLanding:
      type: object
      required: [course, weeks]
      properties:
        course:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            titleEn: { type: [string, 'null'] }
            term: { type: [string, 'null'] }
            lang: { type: string, enum: [he, en] }
            dir: { type: string, enum: [rtl, ltr] }
            address: { type: [string, 'null'] }
        site: { type: string, description: the origin the published lectures are served from }
        testStudent:
          type: boolean
          description: |
            True when the caller is an author of the course, whose own `/me/`
            **is** the course's test student. The workspace draws a banner on
            it.
        weeks:
          type: array
          description: Weeks ascending, the undated last — `byWeek` from `@studio/schema`.
          items:
            type: object
            properties:
              week: { type: [integer, 'null'] }
              lectures:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    number: { type: [integer, 'null'] }
                    title: { type: string }
                    week: { type: [integer, 'null'] }
                    url:
                      type: string
                      description: |
                        The published page on the site. **Absent** when the
                        lecture has never been published — a link that 404s is
                        worse than a line that says nothing.
              exercises:
                type: array
                items: { $ref: '#/components/schemas/StudentExerciseRow' }

    StudentExerciseRow:
      type: object
      description: One exercise on the landing, with this student's own state on it.
      properties:
        id: { type: string }
        title: { type: string }
        week: { type: [integer, 'null'] }
        points: { type: number, description: the sum of the priced questions }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              points: { type: [number, 'null'] }
        release:
          type: object
          properties:
            from: { type: [string, 'null'], format: date-time }
            due: { type: [string, 'null'], format: date-time }
            late: { type: string, enum: [accept, refuse] }
        released: { type: [string, 'null'], description: when the grades were released, or null }
        state:
          type: string
          enum: [not_started, draft, submitted, graded]
        score: { type: [number, 'null'], description: the released total; null until `graded` }
        late: { type: boolean }
        submittedAt: { type: [string, 'null'], format: date-time }
        notYetOpen:
          type: boolean
          description: |
            Present only for the **test student**, on an exercise whose
            `release.from` is still in the future. A real student does not see
            such an exercise at all.

    StudentExercise:
      type: object
      required: [exercise, questions, submission]
      properties:
        course:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            lang: { type: string, enum: [he, en] }
            dir: { type: string, enum: [rtl, ltr] }
        exercise: { $ref: '#/components/schemas/StudentExerciseRow' }
        questions: { type: string, description: '`questions.html` — a notes fragment. Never `key.html`.' }
        submission: { $ref: '#/components/schemas/Submission' }
        answers:
          type: object
          description: The typed answer per question, as the stored fragment.
          additionalProperties: { type: string }
        review:
          oneOf:
            - $ref: '#/components/schemas/StudentReview'
            - type: 'null'
          description: Null until `grades.released` is set on the exercise.
        etag:
          type: [string, 'null']
          description: |
            The ETag of `submission.json`, which every write here sends back as
            `If-Match`. Null means nothing has been written yet and the first
            write should send `If-None-Match: *`.
        testStudent: { type: boolean }
        notYetOpen: { type: boolean }

    ReaderPassword:
      type: object
      description: |
        A course's reader credential as its author reads it back. The user name
        is the course id; the password is the one a student types at the edge's
        prompt.
      required: [user, password, set]
      properties:
        user: { type: string, description: the course id, fixed }
        password: { type: string }
        set: { type: string, format: date-time }
        by: { type: [string, 'null'], description: who set it }
    StoredAsset:
      type: object
      description: What a direct `PUT` of a figure or a data file answers with.
      required: [key, href, bytes, contentType]
      properties:
        key: { type: string, description: the store key }
        href: { type: string, description: '`figures/<name>` — what the fragment should point at' }
        bytes: { type: integer }
        contentType: { type: string }
        maxBytes: { type: integer, description: the cap, 5 MB }
        etag: { type: string }
        versionId: { type: [string, 'null'] }
    DemoManifest:
      type: object
      required: [title]
      properties:
        slug:
          type: string
          description: Ignored on a PUT — the path is the key.
          pattern: '^[a-z0-9][a-z0-9-]{1,39}$'
        title: { type: string, description: 'May be Hebrew; it is what the gallery lists.' }
        description: { type: string }
        aspect:
          type: number
          description: height ÷ width; the frame is sized from it. Default 0.5.
          minimum: 0.05
          maximum: 3
        week:
          type: [integer, 'null']
          description: >-
            The teaching week this demo is listed under, 1-52, or null. A demo
            with none of its own **inherits** the earliest week of the lectures
            that wire it; the listing answers the result as `week` and says
            which it was in `weekFrom`.
          minimum: 1
          maximum: 52
        published:
          type: [object, 'null']
          readOnly: true
          description: written by `POST …/demos/{slug}/publish`; a client body carrying it is a 400
          properties:
            at: { type: string, format: date-time }
            version: { type: [string, 'null'] }
          additionalProperties: false
        author: { type: string }
        version: { type: string }

    DemoListing:
      allOf:
        - $ref: '#/components/schemas/DemoManifest'
        - type: object
          properties:
            usedIn:
              type: array
              description: The lectures whose manifest wires this demo.
              items: { type: string }
            weekFrom:
              type: [string, 'null']
              enum: [demo, lecture, null]
              description: >-
                Where the `week` above came from — `demo` when the manifest
                carries one, `lecture` when it was inherited from the earliest
                wiring lecture, null when there is neither.
            hasHtml: { type: boolean }
            hasStill: { type: boolean }
            etag: { type: string }
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string }
            etags:
              type: object
              description: 'Per-file ETags, on the single-demo GET only.'
              additionalProperties: { type: [string, 'null'] }
    Token:
      type: object
      description: An access token's public half. `hash` is never served.
      properties:
        id: { type: string, description: ULID }
        label: { type: string }
        owner: { type: string }
        groups: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string, enum: [read, write, publish] } }
        courses: { type: array, items: { type: string }, description: '`["*"]` or course ids' }
        prefix: { type: string, description: '`cst_<ulid>` — the public half, what a log line shows' }
        created: { type: string, format: date-time }
        expires: { type: [string, 'null'], format: date-time }
        lastUsed: { type: [string, 'null'], format: date-time }
        revoked: { type: [string, 'null'], format: date-time }
        state: { type: string, enum: [active, expired, revoked] }
    AccessRecord:
      type: object
      properties:
        email: { type: string }
        roles:
          type: object
          additionalProperties: { type: string, enum: [author, viewer] }
        opened:
          type: array
          items: { type: string }
          description: the courses this user opened with `POST /courses`; the cap counts these
        courseLimit:
          type: [integer, 'null']
          description: an administrator's override of the default cap (ten), or null
        created: { type: [string, 'null'], format: date-time }
        updated: { type: [string, 'null'], format: date-time }
        grantedBy: { type: [string, 'null'] }

    Error:
      type: object
      required: [error, message]
      description: |
        The one error shape. `error` is a stable code; `message` is a sentence.
        Codes in use: `unauthenticated`, `forbidden`, `not_found`, `no_route`,
        `method_not_allowed`, `invalid_id`, `invalid_key`, `invalid_json`,
        `empty_body`, `if_match_required`, `precondition`, `locked`,
        `not_lock_holder`, `thread_busy`, `invalid_name`, `invalid_type`,
        `extension_mismatch`, `wrong_folder`, `too_large`, `invalid_mode`,
        `invalid_job`, `invalid_guide`, `invalid_manifest`, `invalid_course`,
        `invalid_theme`, `invalid_preset`, `invalid_token`, `invalid_colour`,
        `invalid_font`, `invalid_weight`, `bad_signature`, `key_not_allowed`,
        `internal`.
      properties:
        error: { type: string }
        message: { type: string }

    ValidationError:
      type: object
      properties:
        error: { type: string, enum: [invalid_manifest, invalid_course] }
        message: { type: string }
        path: { type: string, description: 'JSON Pointer, e.g. /demos/#demo-damped/exports' }
        schema: { type: string, format: uri }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }

    PreconditionError:
      type: object
      properties:
        error: { type: string, enum: [precondition] }
        message: { type: string }
        etag: { type: [string, 'null'] }
        actor: { type: [string, 'null'] }
        ts: { type: [string, 'null'], format: date-time }

    Course:
      type: object
      description: '`course.json`. The authority is `docs/api/course.schema.json`.'
      required: [id]
      properties:
        id: { type: string, description: 'generated by POST /courses; the store key and the studio URL, never a student URL' }
        address:
          type: [string, 'null']
          description: >-
            the published prefix — the URL students read, the edge's key and
            the reader user name. Null until an author sets it with
            `PUT /courses/{c}/address`, and fixed once `publishedFirst` is set.
        publishedFirst:
          type: [string, 'null']
          format: date-time
          description: when the course was first published; what fixes the address
        title: { type: string }
        lang:
          type: string
          enum: [he, en]
          description: |
            The language the course is written in, chosen when it is opened and
            fixed after that. Everything downstream reads it: the page's
            `lang`/`dir`, the words the platform puts on a student's page, and
            the language the editor writes placeholders in. A course stored
            without one reads as `he` — the migration for every course opened
            before 2026-09-17.
        dir:
          type: string
          enum: [rtl, ltr]
          description: |
            The reading direction, **derived** from `lang` (`he` → `rtl`,
            `en` → `ltr`) and stored so a page and a stylesheet need not
            compute it. A body whose `dir` disagrees with its `lang` is a
            `400 invalid_course` at `/dir`.
        titleEn:
          type: [string, 'null']
          description: >-
            the Latin-script title, shown in its own bidi isolate; used by a
            Hebrew course. An English course does not need it.
        term: { type: [string, 'null'] }
        lecturer: { type: [string, 'null'] }
        theme: { $ref: '#/components/schemas/Theme' }
        platform: { type: string, description: 'the platform hash a published page loads' }
        lectures:
          type: array
          items: { type: string }
          description: "the lecture ids in the lecturer's own order"
        exercises:
          type: array
          items: { type: string }
          description: "the exercise ids in the lecturer's own order"
        weeks:
          type: array
          items: { $ref: '#/components/schemas/CourseWeek' }
          description: |
            The weeks this course declares (2026-09-24), ascending by `n`. A
            declaration adds *existence* — a week can be made before anything
            is in it, which is how a term is planned — and a *title*. It is a
            heading and not a container: nothing here names an item, and an
            item's own `week` is on its own manifest. Written by
            `PUT /courses/{c}/weeks`.

    CourseWeek:
      type: object
      description: one week a course declares — its number, and its title when it has one
      required: [n]
      additionalProperties: false
      properties:
        n:
          type: integer
          minimum: 1
          maximum: 52
          description: the week's number, which is its identity; unique within the course
        title:
          type: [string, 'null']
          description: "the week's name, in the course's language; null until somebody writes one"

    Lecture:
      type: object
      description: |
        `lecture.json`, the manifest. The authority is
        `docs/api/lecture.schema.json`, which this repeats loosely; the API
        validates against that file and not against this.
      required: [id]
      properties:
        id: { type: string }
        number: { type: integer }
        week:
          type: [integer, 'null']
          minimum: 1
          maximum: 52
          description: the teaching week this lecture belongs to; absent or null is unscheduled
        title: { type: string }
        docTitle: { type: string }
        slidesTitle: { type: [string, 'null'] }
        kicker: { type: array, items: { type: string } }
        reading: { type: string }
        demos: { $ref: '#/components/schemas/DemoMap' }
        slideDemos: { $ref: '#/components/schemas/DemoMap' }
        published: { $ref: '#/components/schemas/Published' }

    DemoMap:
      type: object
      description: |
        Keyed by the selector of the empty `<div>` in the fragment
        (`#demo-damped`). A value is `{kind: file, demo}` — one of the
        course's own demos, by slug — with `aspect` and `title` copied off
        that demo's `demo.json` when it was wired, because a published page
        has no API to ask. The shape that named a class in the platform
        bundle (`{module, export, opts}`) was removed on 2026-09-16; a body
        carrying one is a `400` whose message names the slug to wire instead.
      additionalProperties:
        type: object
        required: [kind, demo]
        properties:
          kind: { type: string, enum: [file] }
          demo: { type: string }
          aspect: { type: number }
          title: { type: string }

    Published:
      type: [object, 'null']
      description: |
        Written by the publish route and read-only to every client: a body
        carrying it is a `400`.
      properties:
        at: { type: string, format: date-time }
        version: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }

    LectureSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: [string, 'null'] }
        number: { type: [integer, 'null'] }
        week: { type: [integer, 'null'], minimum: 1, maximum: 52 }
        lastModified: { type: [string, 'null'], format: date-time }
        actor: { type: [string, 'null'] }
        lastAction: { type: [string, 'null'] }
        published: { $ref: '#/components/schemas/Published' }
        openNotes: { type: integer }
        hasSlides: { type: boolean }

    GuideEntry:
      type: object
      properties:
        name: { type: string, enum: [conventions, glossary, syllabus, style] }
        size: { type: [integer, 'null'] }
        lastModified: { type: [string, 'null'], format: date-time }
        etag: { type: [string, 'null'] }

    StoredDocument:
      type: [object, 'null']
      description: A fragment as the store holds it. `null` when there is none.
      properties:
        body: { type: string }
        etag: { type: string }
        versionId: { type: string }

    ExerciseQuestion:
      type: object
      description: |
        One question: the `data-id` of its section in `questions.html`, and
        what it is worth. The id is derived on every save of the fragment and
        is not the client's to choose; `points` is.
      properties:
        id: { type: string }
        points:
          type: [number, 'null']
          minimum: 0
          description: null until the author prices it, which blocks releasing a grade and not saving

    ExerciseRelease:
      type: [object, 'null']
      description: When the exercise opens to students, when it is due, and the late rule.
      properties:
        from: { type: [string, 'null'], format: date-time }
        due: { type: [string, 'null'], format: date-time }
        late:
          type: string
          enum: [accept, refuse]
          description: '`accept` takes a late submission and flags it; `refuse` answers 409'

    Exercise:
      type: object
      description: '`exercise.json`. The questions themselves are `questions.html`.'
      properties:
        id: { type: string, description: generated; the server overwrites it with the one in the path }
        title: { type: string }
        week: { type: [integer, 'null'], minimum: 1, maximum: 52 }
        questions:
          type: array
          items: { $ref: '#/components/schemas/ExerciseQuestion' }
        release: { $ref: '#/components/schemas/ExerciseRelease' }
        grades:
          type: [object, 'null']
          readOnly: true
          properties:
            released: { type: [string, 'null'], format: date-time }
        created: { type: [string, 'null'], readOnly: true }
        by: { type: [string, 'null'], readOnly: true }

    ReviewTarget:
      type: object
      description: |
        Where a review item points. Three kinds: `text` (a block id and the
        sentence — the author-notes anchor), `page` (a page number and a
        rectangle in **normalised** coordinates, `[x, y, w, h]`, each 0 to 1)
        and `question` (the whole question). A rectangle is normalised because
        the only stable thing about a scanned page is its own geometry.
      properties:
        kind: { type: string, enum: [text, page, question] }
        block: { type: string, description: 'text: the data-id of the block in the typed answer' }
        quote: { type: [string, 'null'], description: 'text: the sentence' }
        page: { type: integer, minimum: 1, description: 'page: the page number' }
        rect:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number, minimum: 0, maximum: 1 }
          description: 'page: [x, y, w, h] as fractions of the page'

    ReviewVia:
      type: [object, 'null']
      description: |
        The door the write came through, in the event log's own shape: `null`
        for a session, `{ token, label }` for an access token, `{ connector }`
        for the MCP door. **The route fills it from the identity**, and it is
        what decides `state`.
      properties:
        token: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        connector: { type: [string, 'null'] }

    ReviewItem:
      type: object
      description: |
        One remark on one question. `points` is a **delta** the lecturer may use
        or ignore; the number that counts is in `scores`.
      properties:
        id: { type: string, description: 'a ULID; omit it to write a new item, send it to update one' }
        question: { type: string }
        target: { $ref: '#/components/schemas/ReviewTarget' }
        body: { type: string, maxLength: 4000 }
        points: { type: [number, 'null'] }
        author: { type: [string, 'null'], readOnly: true }
        via: { $ref: '#/components/schemas/ReviewVia' }
        state:
          type: string
          enum: [draft, accepted]
          readOnly: true
          description: set by the route from the door, never by the writer
        created: { type: [string, 'null'], readOnly: true }
        updated: { type: [string, 'null'], readOnly: true }

    ReviewScore:
      type: object
      description: The mark for one question; the total is the sum of the accepted ones.
      properties:
        points: { type: [number, 'null'], minimum: 0 }
        author: { type: [string, 'null'] }
        via: { $ref: '#/components/schemas/ReviewVia' }
        state: { type: string, enum: [draft, accepted] }
        updated: { type: [string, 'null'] }

    Review:
      type: object
      description: '`review.json` — the items and the marks for one submission.'
      properties:
        exercise: { type: string }
        student: { type: string, description: 'the sid; no field under `students/` carries an address' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReviewItem' }
        scores:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ReviewScore' }
        updated: { type: [string, 'null'] }

    ReviewSummary:
      type: object
      description: What a client needs to pick the next submission to mark.
      properties:
        drafts: { type: integer }
        accepted: { type: integer }
        scored: { type: array, items: { type: string }, description: questions carrying an accepted mark }
        total: { type: [number, 'null'] }

    SubmissionRow:
      type: object
      properties:
        sid: { type: string }
        email: { type: [string, 'null'], description: 'null on the test student, which is not a person' }
        test: { type: boolean, description: present and true on the course's test student }
        state: { type: string, enum: [not_submitted, draft, submitted, late] }
        submittedAt: { type: [string, 'null'], format: date-time }
        review: { $ref: '#/components/schemas/ReviewSummary' }

    GradingCounts:
      type: object
      description: The header's numbers. The test student is in none of them.
      properties:
        students: { type: integer }
        submitted: { type: integer }
        late: { type: integer }
        notSubmitted: { type: integer }
        graded: { type: integer }
        drafts: { type: integer }

    GradingScreen:
      type: object
      description: One submission, and everything the grading page draws.
      properties:
        course: { type: object }
        exercise: { type: object }
        student:
          type: object
          properties:
            sid: { type: string }
            email: { type: [string, 'null'] }
            test: { type: boolean }
        state: { type: string, enum: [not_submitted, draft, submitted, late] }
        submittedAt: { type: [string, 'null'], format: date-time }
        late: { type: boolean }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: [string, 'null'] }
              points: { type: [number, 'null'] }
              question: { type: string, description: the question's section, as stored }
              key: { type: [string, 'null'], description: the key's section, aligned by order }
              answer: { type: [string, 'null'], description: the typed answer, a notes fragment }
              pages:
                type: array
                items:
                  type: object
                  properties:
                    n: { type: integer }
                    w: { type: [integer, 'null'] }
                    h: { type: [integer, 'null'] }
                    bytes: { type: [integer, 'null'] }
                    url: { type: string, description: a path on this API, not a store key }
        review: { $ref: '#/components/schemas/Review' }
        etag: { type: [string, 'null'] }

    Gradebook:
      type: object
      description: |
        `gradebook.json` — derived, rebuilt on release and on any accepted
        change after it, and disposable. The test student is not in it.
      properties:
        course: { type: string }
        exercises:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              week: { type: [integer, 'null'] }
              points: { type: number }
              released: { type: string, format: date-time }
        students:
          type: array
          items:
            type: object
            properties:
              sid: { type: string }
              email: { type: string }
              exercises:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    state: { type: string, enum: [not_submitted, draft, submitted, late, graded] }
                    total: { type: [number, 'null'] }
              total: { type: number }
        points: { type: number }
        updated: { type: string, format: date-time }

    SaveResult:
      type: object
      properties:
        etag: { type: string }
        versionId: { type: string }
        idsAssigned: { type: integer, description: 'blocks that arrived with no data-id' }
        bytes: { type: integer }

    Version:
      type: object
      properties:
        versionId: { type: string }
        lastModified: { type: string, format: date-time }
        etag: { type: string }
        size: { type: integer }
        actor: { type: [string, 'null'] }
        ts: { type: [string, 'null'], format: date-time }
        action: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }

    Lock:
      type: [object, 'null']
      properties:
        actor: { type: string }
        acquired: { type: string, format: date-time }
        expires: { type: string, format: date-time }

    PresignedPost:
      type: object
      description: |
        Step one of the two-step upload. POST the bytes to `url` as
        `multipart/form-data` with every entry of `fields` first and the file
        last. Locally `url` is `/api/_upload?…&sig=…`, which is the stand-in
        for the presigned S3 POST and is authorised by its signature rather
        than by a session.
      properties:
        key: { type: string }
        url: { type: string }
        fields: { type: object }
        maxBytes: { type: integer }
        contentType: { type: string }
        href: { type: string, description: 'how the fragment should refer to it' }

    PublishJob:
      type: object
      properties:
        job: { type: string }
        status: { type: string, enum: [copying, rendering, done, failed] }
        actor: { type: string }
        course: { type: string }
        lecture: { type: string }
        site: { type: string }
        started: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        keys: { type: array, items: { type: string } }
        published: { $ref: '#/components/schemas/Published' }
        pdf: { type: [string, 'null'] }
        print: { type: [string, 'null'] }
        error: { type: [string, 'null'] }

    Anchor:
      type: object
      description: Where a note points. Resolved by block id, else by the quote.
      properties:
        section: { type: [string, 'null'] }
        block: { type: [string, 'null'] }
        quote: { type: [string, 'null'] }

    Note:
      type: object
      properties:
        id: { type: string }
        author: { type: string }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        status: { type: string, enum: [open, done] }
        anchor: { $ref: '#/components/schemas/Anchor' }
        body: { type: string }
        replies:
          type: array
          items:
            type: object
            properties:
              author: { type: string }
              created: { type: string, format: date-time }
              body: { type: string }

    Thread:
      type: object
      properties:
        notes:
          type: array
          items: { $ref: '#/components/schemas/Note' }
        etag: { type: string }

    Theme:
      type: object
      description: |
        A course's token set over `shared/theme/aegean.css`. The presets are
        `aegean`, `chalk`, `spectrum` and `phase`; only vendored faces are
        selectable, because the site's CSP is `font-src 'self' data:`.
      properties:
        base: { type: string, enum: [aegean] }
        preset: { type: string, enum: [aegean, chalk, spectrum, phase] }
        overrides:
          type: object
          description: token → `#RRGGBB`, for the twelve roles only
          additionalProperties: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        fonts:
          type: object
          properties:
            display: { type: string }
            displayWeight: { type: integer }
            body: { type: string }

    ThemeResponse:
      type: object
      description: Everything the theme panel draws, in one answer.
      properties:
        theme: { $ref: '#/components/schemas/Theme' }
        effective: { type: object }
        fontsResolved: { type: object }
        name: { type: string }
        css: { type: string }
        presets: { type: array, items: { type: object } }
        roles: { type: array, items: { type: array, items: { type: string } } }
        fonts: { type: object }
        verdict:
          type: object
          description: 'the colour-vision check; a failing one is reported, never refused'
          properties:
            level: { type: string, enum: [ok, warn, fail] }
            issues: { type: array, items: { type: string } }
            mode: { type: [string, 'null'] }

    Event:
      type: object
      description: |
        One record per mutation. `action` is one of `notes.save`,
        `slides.save`, `manifest.save`, `course.save`, `figure.upload`,
        `theme.save`, `guide.save`, `publish.start`, `publish.done`,
        `publish.failed`, `restore`, `note.add`, `note.reply`, `note.resolve`,
        `note.reopen`, `note.delete`, `lock.acquire`, `lock.release`, `import`,
        `access.grant`, `access.revoke`, `token.create`, `token.revoke`,
        `demo.save`, `demo.file`, `demo.delete`.
      properties:
        ts: { type: string, format: date-time }
        actor: { type: [string, 'null'] }
        tenant: { type: string }
        course: { type: [string, 'null'] }
        lecture: { type: [string, 'null'] }
        action: { type: string }
        key: { type: [string, 'null'] }
        version: { type: [string, 'null'] }
        etag: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        bytes: { type: [integer, 'null'] }
        client: { type: [string, 'null'] }
